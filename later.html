   var h='<div class="sec">'+(added.length?'✅ '+added.length+'件を追加しました':'追加できませんでした')+'</div><div class="note">'+esc(sm)+'</div>';
   if(failedNow.length)h+='<div class="note" style="color:var(--danger)">⚠️ '+failedNow.length+'枚が失敗しました。<br>理由: '+esc(errs[0]||'不明')+'<br>「失敗分をやり直す」を押すと、その分だけもう一度送ります。</div>';
   else if(errs.length)h+='<div class="note" style="color:var(--danger)">'+esc(errs[0])+'</div>';
   if(added.some(function(x){return x.cat==='none'}))h+='<div class="note">未分類になったものは、設定の「既存カテゴリに割り振る」で振り分けられます。</div>';
   $('#shR',o).innerHTML=h;go.disabled=false;go.style.opacity=1;if(failedNow.length){go.textContent='失敗分をやり直す';go.dataset.retry='1'}else go.textContent='さらに追加'})}
  next()}}
function updSel(){var n=ui.sel?Object.keys(ui.sel).length:0;$('#selN').textContent=n+'件選択中';$('#selMv').disabled=!n;$('#selMv').style.opacity=n?1:.45}
function setSel(on){ui.sel=on?{}:null;document.body.classList.toggle('selmode',!!on);$('#selbar').classList.toggle('on',!!on);if(on)closeOpen();render();updSel();
 if(on){try{if(!localStorage.getItem('later_hint2')){localStorage.setItem('later_hint2','1');toast('カードをタップして選び、下の「移動」で一括移動できます')}}catch(e){}}}
function toggleSel(id){if(!ui.sel)return;if(ui.sel[id])delete ui.sel[id];else ui.sel[id]=1;var el=document.querySelector('#list .card[data-id="'+id+'"]');if(el)el.classList.toggle('sel',!!ui.sel[id]);updSel()}
$('#bSel').onclick=function(){setSel(!ui.sel)};
$('#selX').onclick=function(){setSel(false)};
$('#selAll').onclick=function(){if(!ui.sel)return;var els=document.querySelectorAll('#list .card[data-id]'),all=true;els.forEach(function(el){if(!ui.sel[el.dataset.id])all=false});
 els.forEach(function(el){if(all)delete ui.sel[el.dataset.id];else ui.sel[el.dataset.id]=1;el.classList.toggle('sel',!all)});$('#selAll').textContent=all?'全選択':'選択を外す';updSel()};
$('#selMv').onclick=function(){var ids=Object.keys(ui.sel||{});if(!ids.length)return;
 var cnt={};items.forEach(function(x){cnt[x.cat]=(cnt[x.cat]||0)+1});
 var h='<div class="note">'+ids.length+'件を、どのカテゴリに移しますか？</div><div class="mv">';
 cats.forEach(function(c,j){h+='<button class="btn" type="button" data-t="'+j+'">'+ico(c,30)+esc(c.n)+'<b>'+(cnt[c.id]||0)+'</b></button>'});h+='</div>';
 var o=openSheet('カテゴリへ移動',h,'<button class="btn" id="mvC" type="button">やめる</button>');
 $('#mvC',o).onclick=closeSheet;
 o.addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(!b)return;var dst=cats[+b.dataset.t],chg=[];
  items.forEach(function(x){if(ui.sel[x.id]){if(x.cat!==dst.id){x.cat=dst.id;chg.push(x)}}});
  ui.sel={};saveItems();closeSheet();render();updSel();$('#selAll').textContent='全選択';
  if(cfg()&&chg.length)api('/item','POST',{items:chg}).then(function(){autoFill(chg)}).catch(syncErr);
  toast('「'+dst.n+'」へ '+chg.length+'件 移しました')})};
$('#fab').onclick=function(){openEdit(null)};
$('#fabShot').onclick=openShot;
$('#bSet').onclick=openSettings;
$('#bSearch').onclick=function(){var s=$('#search');s.classList.toggle('on');if(s.classList.contains('on'))$('#q').focus();else{$('#q').value='';ui.q='';render()}};
$('#q').addEventListener('input',function(e){ui.q=e.target.value.trim();renderList()});

(function(){var ch=false;items.forEach(function(x){if(x.done){x.done=false;ch=true}});if(ch)saveItems()})();
fixDates();render();pull(true);
try{if(items.length&&!localStorage.getItem('later_hint1')){localStorage.setItem('later_hint1','1');setTimeout(function(){toast('カードをタップ＝元の投稿へ ／ 右にスワイプ＝編集・削除 ／ 長押し＝詳細')},900)}}catch(e){}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!curSheet)pull(true)});
(function(){try{var q0=new URLSearchParams(location.search),rd=q0.get('rmdone');if(rd!==null){var pd=lsGet('later_rm_pending',null);if(rd==='1'&&pd){var it0=items.filter(function(x){return x.id===pd.id})[0];if(it0){it0.rm=pd.label;saveItems();up(it0);render()}toast('✓ リマインダーに追加しました')}else toast('リマインダーに追加できませんでした');try{localStorage.removeItem('later_rm_pending')}catch(e){}history.replaceState(null,'',location.pathname)}}catch(e){}})();
(function(){try{var p=new URLSearchParams(location.search),u=p.get('u')||p.get('url'),t=p.get('t')||p.get('title')||'',c=p.get('c')||'';
 if(u||t){history.replaceState(null,'',location.pathname);
  var text=u||'';var m=text.match(/https?:\/\/\S+/);var url=m?m[0]:'';var rest=(t||(m?text.replace(m[0],'').trim():'')).trim();
  setTimeout(function(){openEdit(null,{url:url,title:rest,cat:cats.some(function(x){return x.id===c})?c:''})},150)}}catch(e){}})();
window.__later={items:function(){return items},cats:function(){return cats},render:render};
})();
