<style>
:root{--bg:#f3f2f5;--card:#fff;--text:#34313d;--muted:#817b8c;--line:#e6e2ec;--accent:#8272ad;--accent-soft:#eee9f7;--accent-text:#5f4f93;--danger:#c0506b;--chip:#fff;--shadow:0 1px 6px #3a2c6a14;--sheet:#fbfafc;--input:#fff}
html[data-theme="dark"]{--bg:#242229;--card:#2e2b35;--text:#e9e4ee;--muted:#a49eb0;--line:#3d3945;--accent:#a894e0;--accent-soft:#40385f;--accent-text:#d9cef7;--danger:#e78aa0;--chip:#302d38;--shadow:0 1px 8px #0006;--sheet:#2e2b35;--input:#38343f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh;padding-bottom:calc(env(safe-area-inset-bottom) + 110px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:640px;margin:0 auto}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.top{display:flex;align-items:center;gap:8px}
.top h1{margin:0;font-size:21px;font-weight:800;flex:1;letter-spacing:.02em}
.ib{width:42px;height:42px;border-radius:13px;border:0;background:var(--chip);box-shadow:var(--shadow);display:grid;place-items:center;transition:scale .12s}
.ib:active{scale:.92}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.back{font-size:12px;color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:2px}
.search{display:none;margin:8px 0 0}
.search.on{display:block}
.search input{width:100%;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--input);padding:0 14px;font-size:16px;outline:0}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:5px;height:36px;padding:0 13px;border-radius:99px;border:1.5px solid transparent;background:var(--chip);box-shadow:var(--shadow);font-size:13.5px;font-weight:700;color:var(--text);transition:scale .12s}
.chip:active{scale:.95}
.chip b{font-weight:600;color:var(--muted);font-size:12px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.chips.sub{padding-top:0}
.chips.sub .chip{height:30px;font-size:12.5px;box-shadow:none;background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.chips.sub .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
main{padding:2px 14px 10px}
.card{display:flex;gap:12px;margin:9px 0;background:var(--card);border-radius:17px;padding:12px;box-shadow:var(--shadow);position:relative;border-left:5px solid var(--c,#b9a6e8);transition:opacity .2s}
.card.done{opacity:.5}
.card .tile{width:58px;height:58px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:27px;background:color-mix(in srgb,var(--c) 20%,var(--card))}
.card .date{width:58px;flex:none;border-radius:13px;text-align:center;padding:6px 0 5px;background:color-mix(in srgb,var(--c) 20%,var(--card));color:color-mix(in srgb,var(--c) 70%,var(--text))}
.card .date i{font-style:normal;font-size:11px;font-weight:700;display:block}
.card .date b{font-size:22px;line-height:1.1;display:block}
.card .body{flex:1;min-width:0}
.card .t{font-weight:800;font-size:15px;line-height:1.35;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:12.5px;color:var(--muted);margin-top:3px;word-break:break-word}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tg{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,var(--card));color:color-mix(in srgb,var(--c) 72%,var(--text))}
.tg.k{background:var(--accent-soft);color:var(--accent-text)}
.foot{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11.5px;color:var(--muted)}
.foot .sp{flex:1}
.cd{font-weight:800;color:#d27b3f}
html[data-theme="dark"] .cd{color:#f0a56e}
.cd.past{color:var(--muted)}
.mini{width:36px;height:34px;border-radius:11px;border:0;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;transition:scale .12s}
.mini:active{scale:.9}
.mini svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mini.on{background:var(--accent);color:#fff}
html[data-theme="dark"] .mini.on{color:#241f33}
.empty{text-align:center;color:var(--muted);padding:40px 20px;line-height:1.8;font-size:14px}
.empty b{display:block;font-size:16px;color:var(--text);margin-bottom:6px}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(env(safe-area-inset-bottom) + 20px);width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:0 8px 22px #5a46a066;display:grid;place-items:center;z-index:25;transition:scale .14s}
html[data-theme="dark"] .fab{color:#241f33}
.fab:active{scale:.9}
.fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
/* sheets */
.ov{position:fixed;inset:0;z-index:50;background:#2e293949;display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease-out}
html[data-theme="dark"] .ov{background:#0a090d99}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{translate:0 24px;opacity:.4}to{translate:0 0;opacity:1}}
.sheet{position:relative;width:min(620px,100%);max-height:90dvh;display:flex;flex-direction:column;background:var(--sheet);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px #342c4630;animation:rise .2s cubic-bezier(.2,.8,.3,1.05)}
.sheet:before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:3px;background:var(--line)}
.sheet .hd{padding:22px 18px 8px;font-weight:800;font-size:17px;flex:none;touch-action:none}
.sheet .bd{padding:2px 18px 12px;overflow-y:auto;flex:1;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet .ft{flex:none;display:flex;gap:10px;justify-content:flex-end;padding:10px 18px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--sheet)}
.btn{min-height:46px;padding:0 18px;border-radius:13px;border:1px solid var(--line);background:var(--chip);font-weight:700;font-size:15px;transition:scale .12s}
.btn:active{scale:.96}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme="dark"] .btn.pri{color:#241f33}
.btn.dng{color:var(--danger);margin-right:auto}
label.l{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:13px 0 5px}
.in{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--input);padding:10px 13px;font-size:16px;outline:0}
.in:focus{border-color:var(--accent)}
textarea.in{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row .in{flex:1}
.pick{display:flex;flex-wrap:wrap;gap:7px}
.pick button{height:38px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--chip);font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:5px}
.pick button.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 22%,var(--card))}
.pick button .rec{font-size:10px;background:#f3d27a;color:#5d4710;padding:1px 6px;border-radius:99px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--chip);font-weight:700}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.sec{margin:18px 0 4px;font-weight:800;font-size:14px}
.note{font-size:12.5px;color:var(--muted);line-height:1.7;margin:4px 0}
.catrow{display:flex;gap:6px;align-items:center;margin:6px 0}
.catrow .em{width:52px;text-align:center;padding:0}
.catrow .nm{flex:1}
.catrow .x{width:40px;height:44px;flex:none;border-radius:11px;border:1px solid var(--line);background:var(--chip);color:var(--danger)}
.warn{color:#c76a1e}
html[data-theme="dark"] .warn{color:#f0a56e}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 94px);translate:-50% 0;z-index:100;display:flex;align-items:center;gap:12px;background:#2f2a3a;color:#fff;border-radius:14px;padding:10px 12px 10px 16px;font-size:13.5px;box-shadow:0 8px 24px #0005;max-width:92vw;animation:rise .2s ease-out}
html[data-theme="dark"] #toast{background:#4a4457}
#toast button{background:#e6dcf7;color:#4d3f73;border:0;border-radius:10px;padding:8px 14px;font-weight:700;min-height:36px}
.dlg{position:fixed;inset:0;z-index:120;background:#14141e60;display:grid;place-items:center;padding:24px}
.dlg .c{background:var(--sheet);border-radius:18px;padding:20px;max-width:340px;width:100%;box-shadow:0 12px 40px #0005}
.dlg p{margin:0 0 16px;line-height:1.7;white-space:pre-line;font-size:14.5px}
.dlg .b{display:flex;gap:10px;justify-content:flex-end}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>
<div id="app">
<header>
  <a class="back" href="./index.html">← プロンプトサイトへ</a>
  <div class="top">
    <h1>あとで見る</h1>
    <button class="ib" id="bSearch" aria-label="検索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.500 4.500"/></svg></button>
    <button class="ib" id="bSet" aria-label="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.500M12 18.500V21M3 12h2.500M18.500 12H21M5.600 5.600l1.800 1.800M16.600 16.600l1.800 1.800M5.600 18.400l1.800-1.800M16.600 7.400l1.800-1.800"/></svg></button>
  </div>

</div>

<script>
(function(){
'use strict';
var VER='later v0.2',DATE='2026-10-20';
var KI='later_items_v1',KC='later_cats_v1',KT='later_theme',KB='later_last_backup';
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('保存できませんでした(容量)');return false}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---- categories (fields per category) ---- */
var DEF=[
 {id:'shop',n:'お店',e:'🍽',c:'#e58fa6',facet:'area',fields:[['area','エリア','表参道・渋谷・博多'],['genre','ジャンル','ラーメン・カフェ'],['hours','営業時間','11:00–23:00']]},
 {id:'recipe',n:'レシピ',e:'🍳',c:'#e7a77c',facet:'genre',fields:[['genre','ジャンル','和食・お菓子・作り置き'],['time','調理時間','15分']]},
 {id:'event',n:'イベント',e:'🎫',c:'#7fa8e6',facet:'place',date:'開催日',fields:[['time','時間','10:00–17:00'],['place','場所','代々木公園']]},
 {id:'art',n:'作画Tips',e:'✏️',c:'#9b8fe5',facet:'tags',fields:[]},
 {id:'font',n:'フォント素材',e:'🔤',c:'#b48fe0',facet:'license',fields:[['license','ライセンス','商用可・個人のみ']]},
 {id:'brush',n:'ペン・ブラシ配布',e:'🖌',c:'#6fc2ae',facet:'soft',fields:[['soft','対応ソフト','CLIP STUDIO・Procreate']]},
 {id:'sale',n:'通販・発売',e:'🛍',c:'#e3bc5e',facet:'shop',date:'発売・販売開始日',fields:[['time','開始時間','20:00'],['price','価格','¥3,300'],['shop','販売先','公式ストア']]},
 {id:'video',n:'動画',e:'▶️',c:'#e68a8a',facet:'tags',fields:[['len','長さ','12分']]},
 {id:'movie',n:'映画・作品',e:'🎬',c:'#8a9ae6',facet:'where',date:'公開日',fields:[['where','配信先・劇場','Netflix・TOHO']]},
 {id:'none',n:'未分類',e:'❓',c:'#b0aab9',facet:'tags',fields:[],sys:true}
];
var cats=[],items=[];
function loadCats(){var s=lsGet(KC,null);if(!s||!s.length){cats=DEF.map(function(x){return {id:x.id,n:x.n,e:x.e,c:x.c}});lsSet(KC,cats)}else cats=s;
 if(!cats.some(function(c){return c.id==='none'}))cats.push({id:'none',n:'未分類',e:'❓',c:'#b0aab9'})}
function cdef(id){var d=null;for(var i=0;i<DEF.length;i++)if(DEF[i].id===id)d=DEF[i];return d||{facet:'tags',fields:[]}}
function cat(id){for(var i=0;i<cats.length;i++)if(cats[i].id===id)return cats[i];return cats.filter(function(c){return c.id==='none'})[0]}
function saveItems(){return lsSet(KI,items)}
function saveCats(){var r=lsSet(KC,cats);upCats();return r}
items=lsGet(KI,[]);loadCats();
/* ---- cloud sync (Cloudflare Worker) ---- */
var CK='later_cloud_v1',ctm=null;
function cfg(){var c=lsGet(CK,null);return c&&c.url&&c.token?c:null}
function api(path,method,body){var c=cfg();if(!c)return Promise.reject(new Error('no-config'));
 return fetch(c.url.replace(/\/+$/,'')+path,{method:method||'GET',headers:{'authorization':'Bearer '+c.token,'content-type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function syncErr(){toast('クラウドに送れませんでした（通信を確認）')}
function up(it){if(cfg())api('/item','POST',{item:it}).catch(syncErr)}
function down(id){if(cfg())api('/item?id='+encodeURIComponent(id),'DELETE').catch(syncErr)}
function upCats(){if(!cfg())return;clearTimeout(ctm);ctm=setTimeout(function(){api('/cats','PUT',{cats:cats}).catch(function(){})},800)}
function pull(quiet){if(!cfg())return Promise.resolve();
 return api('/data').then(function(d){
  if((!d.items||!d.items.length)&&items.length){return api('/item','POST',{items:items}).then(function(){return api('/cats','PUT',{cats:cats})})}
  items=d.items||[];if(d.cats&&d.cats.length){cats=d.cats;if(!cats.some(function(c){return c.id==='none'}))cats.push({id:'none',n:'未分類',e:'❓',c:'#b0aab9'})}
  lsSet(KI,items);lsSet(KC,cats);render()}).catch(function(){if(!quiet)toast('クラウドから読み込めませんでした')})}

/* ---- helpers ---- */
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}}
function srcOf(u){var h=host(u);if(/(^|\.)(x|twitter)\.com$/.test(h))return 'X';if(/instagram\.com$/.test(h))return 'Instagram';if(/youtube\.com$|youtu\.be$/.test(h))return 'YouTube';if(/tiktok\.com$/.test(h))return 'TikTok';if(/nicovideo\.jp$/.test(h))return 'ニコニコ';return h||''}
var KW={
 shop:['ランチ','ディナー','カフェ','ラーメン','居酒屋','食べログ','tabelog','予約','営業時間','オープン','グルメ','寿司','焼肉','ベーカリー'],
 recipe:['レシピ','作り方','材料','簡単','クックパッド','cookpad','時短','作り置き'],
 event:['開催','イベント','フェス','マルシェ','日程','入場','ライブ','展示','展覧','POP UP','ポップアップ','即売会'],
 art:['描き方','作画','コツ','tips','パース','構図','デッサン','線画','塗り','背景','髪の'],
 font:['フォント','font','書体','明朝','ゴシック','丸ゴ'],
 brush:['ブラシ','配布','ペン','素材','クリスタ','clip studio','procreate','photoshop','フリー素材'],
 sale:['予約開始','発売','通販','販売開始','再販','受注','抽選','先行販売','商品','在庫'],
 video:['動画','youtube','見る','配信','アーカイブ'],
 movie:['映画','公開','上映','予告','netflix','prime','アニメ','ドラマ','劇場','シリーズ']
};
function suggest(url,title,note){
 var t=((title||'')+' '+(note||'')+' '+(url||'')).toLowerCase(),best=null,bs=0,h=host(url);
 var sc={};
 Object.keys(KW).forEach(function(k){var n=0;KW[k].forEach(function(w){if(t.indexOf(w.toLowerCase())>=0)n++});if(n)sc[k]=n});
 if(/youtube\.com$|youtu\.be$|nicovideo\.jp$|vimeo\.com$/.test(h))sc.video=(sc.video||0)+2;
 if(/tabelog\.com$|retty\.me$|hotpepper\.jp$|gnavi\.co\.jp$/.test(h))sc.shop=(sc.shop||0)+3;
 if(/cookpad\.com$|kurashiru\.com$|delishkitchen\.tv$/.test(h))sc.recipe=(sc.recipe||0)+3;
 if(/amazon\.|rakuten\.|booth\.pm$|shop/.test(h))sc.sale=(sc.sale||0)+1;
 if(/booth\.pm$/.test(h))sc.brush=(sc.brush||0)+1;
 if(/eiga\.com$|filmarks\.com$/.test(h))sc.movie=(sc.movie||0)+3;
 Object.keys(sc).forEach(function(k){if(sc[k]>bs){bs=sc[k];best=k}});
 return best;
}
function guessDate(txt){var m=String(txt||'').match(/(?:(\d{4})[\/年\.])?(\d{1,2})[\/月\.](\d{1,2})日?/);if(!m)return '';
 var now=new Date(),y=m[1]?+m[1]:now.getFullYear(),mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>31)return '';
 var dt=new Date(y,mo-1,d);if(!m[1]&&dt<new Date(now.getFullYear(),now.getMonth(),now.getDate()-30))dt=new Date(y+1,mo-1,d);
 return dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2)}
function daysTo(s){var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]),n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((d-n)/864e5)}
var WD=['日','月','火','水','木','金','土'];
function fmtD(ts){var d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()}

/* ---- ui state ---- */
var ui={cat:'all',sub:null,q:''};
function facetVal(it,key){if(key==='tags')return (it.tags||[]);var v=(it.f||{})[key];return v?[v]:[]}
function matches(it){
 if(ui.cat!=='all'&&it.cat!==ui.cat)return false;
 if(ui.sub){var fk=cdef(ui.cat).facet;if(facetVal(it,fk).indexOf(ui.sub)<0)return false}
 if(ui.q){var h=(it.title+' '+it.note+' '+it.url+' '+(it.tags||[]).join(' ')+' '+Object.keys(it.f||{}).map(function(k){return it.f[k]}).join(' ')).toLowerCase();if(h.indexOf(ui.q.toLowerCase())<0)return false}
 return true}
function renderChips(){
