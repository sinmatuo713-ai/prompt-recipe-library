.tiles.sh div{width:88px;height:88px;border-radius:13px}
.tw>.addt{flex:none;width:28px;height:28px;border-radius:50%;background:transparent;border:1.5px dashed var(--line,#cfc8de);color:#b3a9cc;display:grid;place-items:center;font-size:17px;font-weight:400;line-height:1;align-self:flex-end;margin-bottom:2px;overflow:visible;transform:none}
html[data-theme="dark"] .tw>.addt{border-color:#5a5468;color:#7d7692}
.vw .vc{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 64px);display:flex;justify-content:center;gap:8px;z-index:4;pointer-events:none}
.vw .vc button{pointer-events:auto;height:32px;padding:0 12px;border-radius:99px;border:0;background:#00000059;color:#fff;font-weight:700;font-size:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.vw .vc button.on{background:#a894e0;color:#fff}.vw .vc button:disabled{opacity:.35}
.tiles .xb{position:absolute;right:5px;top:0;width:12px;height:24px;font-style:normal;filter:drop-shadow(0 1px 1.5px #0000003d)}
.tiles .xb b{display:block;width:100%;height:100%;background:#f58db2;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
html[data-theme="dark"] .tiles .xb b{background:#ef86ab}
.vw .bar button.ic{width:38px;padding:0;font-size:18px;line-height:1}
.av.sh{background:none!important}
.av.sh .ico{border-radius:50%}
.tiles em{position:absolute;inset:0;background:#0008;color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:16px}
.chp{display:flex;gap:5px;align-items:center;flex-wrap:wrap;row-gap:4px}.card.tn .chp{flex-wrap:nowrap;overflow:hidden}
.chp>*{flex:none}
.cal{display:block;padding:6px 0 4px;grid-template-columns:none}
.cal .wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--muted);text-align:center;padding-bottom:3px}
.cal .wd b{font-weight:600}.cal .wd b:first-child{color:#d0788c}.cal .wd b:last-child{color:#6f94d8}
.wk{position:relative;display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line)}
.wk .c{height:auto;min-height:74px;border-radius:0;border:0;align-items:flex-start;justify-content:flex-start;padding:3px 0 0 6px;font-size:12.5px;font-weight:700;position:relative;display:flex;flex-direction:column;text-align:left;gap:0}
.wk .c.t{background:transparent}
.wk .c.o{color:var(--muted);opacity:.5;visibility:visible}
.wk .c.t b{display:inline-block;background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;margin:-2px 0 0 -4px;font-weight:700}
html[data-theme="dark"] .wk .c.t b{color:#241f33}
.wk .c.s{background:var(--accent-soft)}
.wk .ev{position:absolute;height:17px;border-radius:5px;font-size:10.5px;font-weight:700;line-height:17px;padding:0 5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;background:var(--c)}
html[data-theme="dark"] .wk .ev{color:#1e1b24}
.wk .dt{position:absolute;bottom:6px;width:7px;height:7px;border-radius:50%;background:var(--c);pointer-events:none}
</style>

 function goDir(dx){var ids=[].map.call(document.querySelectorAll('#chips .chip.ci'),function(x){return x.dataset.c}),i=ids.indexOf(ui.cat);if(i<0)return;var n=(i+(dx<0?1:-1)+ids.length)%ids.length;
  closeOpen();goCat(ids[n]);scrollToCur(false);try{navigator.vibrate&&navigator.vibrate(6)}catch(x){}
  try{L.animate&&L.animate([{opacity:.45},{opacity:1}],{duration:130,easing:'ease-out'})}catch(x){}}
 function openSearch(){var sb=$('#search');if(!sb.classList.contains('on')){sb.classList.add('on');setTimeout(function(){$('#q').focus()},30)}}
 document.addEventListener('touchstart',function(e){ok=false;fired=false;if(ui.sel||e.touches.length>1)return;var t=e.target;if(!t.closest('#list')||t.closest('#strip,input,textarea,select,.sheet'))return;ok=true;onCard=!!t.closest('.card');sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=SE()},{passive:true,capture:true});
 document.addEventListener('touchmove',function(e){if(!ok||fired)return;var t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy,adx=Math.abs(dx),ady=Math.abs(dy);
  if(sw.mode===1)return;
  if(adx>56&&adx>ady*1.5){fired=true;sw.sup=Date.now();goDir(dx);return}
  if(dy>64&&ady>adx*1.5&&st<=2&&SE()<=2){fired=true;openSearch()}},{passive:true,capture:true})})();
$('#bSearch').onclick=function(){var s=$('#search');s.classList.toggle('on');if(s.classList.contains('on'))$('#q').focus();else{$('#q').value='';ui.q='';s.classList.remove('hq');render()}};
$('#q').addEventListener('input',function(e){ui.q=e.target.value.trim();$('#search').classList.toggle('hq',!!e.target.value);renderList()});
$('#qx').addEventListener('click',function(){var q=$('#q');q.value='';ui.q='';q.blur();var sb=$('#search');sb.classList.remove('hq');sb.classList.remove('on');render()});

fixDates();render();pull(true);
try{if(items.length&&!localStorage.getItem('later_hint1')){localStorage.setItem('later_hint1','1');setTimeout(function(){toast('カードをタップ＝元の投稿へ ／ 左右にスワイプ＝カテゴリ切替 ／ ⋯＝編集・削除 ／ 長押し＝編集')},900)}}catch(e){}
/* 下にスクロールしたら検索窓をしまう（入力中・検索語があるときは残す） */
(function(){var last=0;window.addEventListener('scroll',function(){var y=window.scrollY||0,sb=document.getElementById('search'),q=document.getElementById('q');
 if(sb&&sb.classList.contains('on')&&y>last+6&&y>60&&q&&!q.value.trim()){if(document.activeElement===q)q.blur();sb.classList.remove('on')}last=y},{passive:true})})();
/* Safariの「引っ張って更新」を止める（先頭で下に引っ張るときだけ） */
(function(){var px=0,py=0;document.addEventListener('touchstart',function(e){if(e.touches.length===1){px=e.touches[0].clientX;py=e.touches[0].clientY}},{passive:true});
 document.addEventListener('touchmove',function(e){if(e.touches.length!==1||!e.cancelable)return;var dy=e.touches[0].clientY-py,dx=e.touches[0].clientX-px;
  if(dy<8||Math.abs(dy)<Math.abs(dx)*1.5)return;
  var tg=e.target;if(!tg||!tg.closest)return;
  if(tg.closest('.cov,.dlg,textarea,input,select,#chips,.stb'))return;
  if(tg.closest('.ov,.vw')){var sc=tg.closest('.bd,.ftx');if(sc&&sc.scrollTop>0)return}
  else if((window.scrollY||document.documentElement.scrollTop||0)>0)return;
  e.preventDefault()},{passive:false})})();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!curSheet){render();pull(true)}});
(function(){try{var q0=new URLSearchParams(location.search),rd=q0.get('rmdone');if(rd!==null){var pd=lsGet('later_rm_pending',null);if(rd==='1'){var it0=pd&&items.filter(function(x){return x.id===pd.id})[0];if(it0&&!it0.rm){it0.rm=pd.label;saveItems();up(it0);render()}toast('✓ リマインダーに追加しました')}else{var it1=pd&&items.filter(function(x){return x.id===pd.id})[0];if(it1){delete it1.rm;saveItems();up(it1);render()}toast('リマインダーに追加できませんでした')}try{localStorage.removeItem('later_rm_pending')}catch(e){}history.replaceState(null,'',location.pathname)}}catch(e){}})();
(function(){try{var p=new URLSearchParams(location.search),u=p.get('u')||p.get('url'),t=p.get('t')||p.get('title')||'',c=p.get('c')||'';
 if(u||t){history.replaceState(null,'',location.pathname);
  var text=u||'';var m=text.match(/https?:\/\/\S+/);var url=m?m[0]:'';var rest=(t||(m?text.replace(m[0],'').trim():'')).trim();
  setTimeout(function(){openEdit(null,{url:url,title:rest,cat:cats.some(function(x){return x.id===c})?c:''})},150)}}catch(e){}})();
window.__later={items:function(){return items},cats:function(){return cats},render:render};
})();
