<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f2f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ネームノート">
<title>ネームノート</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23eee9f7'/%3E%3Cellipse cx='32' cy='29' rx='19' ry='16' fill='%23fff' stroke='%238272ad' stroke-width='4'/%3E%3Cpath d='M22 42l-4 11 14-8z' fill='%23fff' stroke='%238272ad' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='29' r='4' fill='%23f58db2'/%3E%3C/svg%3E">
<style>
:root{--bg:#f3f2f5;--card:#fff;--text:#34313d;--muted:#817b8c;--line:#e6e2ec;--accent:#8272ad;--accent-soft:#eee9f7;--accent-text:#5f4f93;--pink:#f58db2;--pink-soft:#fde8f0;--pink-text:#b4456f;--danger:#c0506b;--shadow:0 1px 6px #3a2c6a14;--input:#fff;--sheet:#fbfafc;--amber:#a8741a;--amber-soft:#fbf0d9}
@media(prefers-color-scheme:dark){:root{--bg:#242229;--card:#2e2b35;--text:#e9e4ee;--muted:#a49eb0;--line:#3d3945;--accent:#a894e0;--accent-soft:#40385f;--accent-text:#d9cef7;--pink-soft:#4b2f3d;--pink-text:#f6a9c6;--danger:#e78aa0;--shadow:0 1px 8px #0006;--input:#38343f;--sheet:#2e2b35;--amber:#e7bd6a;--amber-soft:#4a3d22;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh;padding-bottom:calc(env(safe-area-inset-bottom) + 96px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:720px;margin:0 auto}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.top{display:flex;align-items:center;gap:8px}
.top h1{min-width:0;margin:0;font-size:21px;font-weight:800;flex:1;letter-spacing:.02em;display:flex;align-items:center;gap:8px;min-height:38px}
.top h1 svg{width:28px;height:28px}
.top h1 small{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0}
.ib{width:42px;height:42px;border-radius:13px;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;transition:scale .12s}
.ib:active{scale:.92}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pgs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.pgs::-webkit-scrollbar{display:none}
.pgc{position:relative;flex:none;min-width:42px;height:32px;padding:0 10px;border-radius:16px;border:0;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--muted)}
.pgc.on{background:var(--accent-soft);color:var(--accent-text);font-weight:800}
.pgc i{position:absolute;top:-1px;right:2px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--bg)}
.pgc i.s{background:var(--pink)}.pgc i.c{background:#e8a33a;right:12px}
.banner{margin:4px 16px 0;padding:10px 12px;border-radius:12px;background:var(--amber-soft);color:var(--amber);font-size:13px;display:flex;gap:8px;align-items:center;line-height:1.45}
.banner b{font-weight:800}.banner .sp{flex:1}
.banner button{border:0;background:var(--card);color:var(--text);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin:12px 16px 0;padding:14px 14px 12px;scroll-margin-top:150px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pn{font-size:17px;font-weight:800;color:var(--accent-text)}
.cnt{font-size:12px;color:var(--muted)}
.sp{flex:1}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;line-height:18px;background:var(--accent-soft);color:var(--accent-text)}
.tag.chg{background:var(--amber-soft);color:var(--amber)}
.tag.st{background:var(--pink-soft);color:var(--pink-text)}
.tag.cry{background:#e3f1ec;color:#3b7a63}
@media(prefers-color-scheme:dark){.tag.cry{background:#26403a;color:#9ad6bf}}
.mini{border:0;background:var(--accent-soft);color:var(--accent-text);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:700}
.mini:active{opacity:.7}
.cp{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:7px 14px;font-size:13px;font-weight:800}
.cp:active{opacity:.8}
.bl{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px}
.pv{flex:none;width:106px;display:flex;justify-content:center;padding-top:2px}
.pvb{writing-mode:vertical-rl;text-orientation:mixed;font-family:'Hiragino Mincho ProN','Hiragino Kaku Gothic ProN','Noto Sans CJK JP','Noto Sans JP',sans-serif;white-space:pre;font-size:12px;line-height:1.7;border:1.5px solid color-mix(in srgb,var(--text) 55%,transparent);border-radius:50%/42%;padding:14px 10px;background:var(--input);align-self:flex-start;min-height:60px}
.bx{flex:1;min-width:0}
.bx textarea{width:100%;display:block;border:1.5px solid var(--line);border-radius:12px;background:var(--input);padding:9px 11px;font-size:16px;line-height:1.55;resize:none;overflow-x:auto;overflow-y:hidden;white-space:pre;scrollbar-width:none;outline:none}
.bx textarea::-webkit-scrollbar{display:none}
.bx textarea:focus{border-color:var(--accent)}
.bm{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.ln{font-size:12px;color:var(--muted)}.ln.over{color:var(--danger);font-weight:800}
.warn{font-size:11.5px;color:var(--amber)}
.bm .go2+.cb{margin-left:6px}.bm .cb{margin-left:auto;border:0;background:transparent;color:var(--accent-text);font-size:12px;font-weight:700;padding:3px 6px;border-radius:8px}
.bm .cb:active{background:var(--accent-soft)}
.rem{margin-top:6px;font-size:12.5px;color:var(--pink-text);background:var(--pink-soft);border-radius:8px;padding:6px 9px;line-height:1.5}
.none{font-size:13px;color:var(--muted);padding:2px 0 10px}
.memo{border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mh b{font-size:13px;color:var(--muted);font-weight:800}
.mi{display:flex;gap:8px;font-size:14px;line-height:1.6;margin:0 0 5px}
.ml{flex:none;font-size:11px;font-weight:800;color:var(--accent-text);background:var(--accent-soft);border-radius:6px;padding:0 7px;height:20px;line-height:20px;margin-top:2px;white-space:nowrap}
.ml.ins{background:var(--pink-soft);color:var(--pink-text)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:12.5px;color:var(--danger);margin-bottom:6px;word-break:break-all}
.stale{font-size:12px;color:var(--amber);margin-bottom:6px}
.stx{font-size:12px;color:var(--accent-text);font-weight:700}
details.src{margin-top:8px}
details.src summary{font-size:12px;color:var(--muted);cursor:pointer;padding:4px 0}
details.src pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13px;line-height:1.7;margin:6px 0 0;color:var(--muted)}
.imp{margin:14px 16px 0;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.imp h2{margin:0 0 4px;font-size:17px}
.imp p{margin:0 0 12px;font-size:13px;color:var(--muted);line-height:1.6}
.imp textarea{width:100%;height:260px;border:1.5px solid var(--line);border-radius:12px;background:var(--input);padding:11px;font-size:16px;line-height:1.6;outline:none;resize:vertical}
.imp textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 18px;font-size:15px;font-weight:800;background:var(--accent);color:#fff}
.btn.sub{background:var(--accent-soft);color:var(--accent-text)}
.btn:active{opacity:.8}
.btn[disabled]{opacity:.5}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent);pointer-events:none}
.bar .in{max-width:720px;margin:0 auto;display:flex;gap:8px;pointer-events:auto}
.bar .btn{flex:1;box-shadow:0 2px 10px #3a2c6a33;padding:13px 10px;font-size:14px}
.bar .btn.sub{background:var(--card);color:var(--accent-text)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%) translateY(20px);background:#34313dee;color:#fff;border-radius:12px;padding:10px 16px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ov{position:fixed;inset:0;background:#0006;z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--sheet);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:88dvh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:17px}
.sheet h4{margin:18px 0 8px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.set{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.set .sp{flex:1}
.set small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.stp{display:flex;align-items:center;gap:2px;background:var(--accent-soft);border-radius:10px}
.stp button{width:34px;height:34px;border:0;background:transparent;font-size:18px;font-weight:800;color:var(--accent-text)}
.stp span{min-width:26px;text-align:center;font-weight:800;color:var(--accent-text)}
.sw{position:relative;width:46px;height:28px;border-radius:14px;border:0;background:var(--line);flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px #0003}
.sw.on{background:var(--accent)}.sw.on::after{left:21px}
.sheet input[type=text],.sheet input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--input);padding:9px 11px;font-size:16px;margin-bottom:8px;outline:none}
.sheet input:focus{border-color:var(--accent)}
.lnk{border:0;background:transparent;color:var(--danger);font-size:13px;font-weight:700;padding:8px 0}

#ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top h1 small{white-space:nowrap}
.tabs{display:flex;background:var(--accent-soft);border-radius:13px;padding:3px;margin:2px 0 10px}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:7px 4px;font-size:13.5px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--accent-text);font-weight:800;box-shadow:0 1px 3px #3a2c6a22}
.wk{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin:12px 16px 0;padding:14px 8px 14px 16px}
.wk:active{opacity:.85}
.wk .wb{flex:1;min-width:0}
.wk b{display:block;font-size:16.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk small{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
.wk .wm{flex:none;width:40px;height:40px;border:0;background:transparent;border-radius:12px;color:var(--muted);display:grid;place-items:center}
.wk .wm:active{background:var(--accent-soft)}
.wk .wm svg{width:22px;height:22px;fill:currentColor}
.empty{margin:60px 24px 0;text-align:center;color:var(--muted);font-size:14px;line-height:1.8}
.mtop{display:flex;align-items:center;gap:10px;margin:12px 16px 0;flex-wrap:wrap}
.lgd{display:flex;gap:12px;font-size:12px;color:var(--muted);align-items:center;flex:1}
.vsw{display:flex;background:var(--accent-soft);border-radius:10px;padding:2px}
.vsw button{border:0;background:transparent;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.vsw button.on{background:var(--card);color:var(--accent-text);box-shadow:0 1px 2px #3a2c6a22}
.u{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px;text-decoration-skip-ink:none}
.uf{text-decoration-color:#f2a1b8}.up{text-decoration-color:#86b8f0}.ul{text-decoration-color:#9ad3a6}
.mp{margin:0 16px;padding:0}
.mp .sep{display:flex;align-items:center;gap:8px;margin:18px 0 6px;color:var(--muted);font-size:12px;font-weight:800}
.mp .sep:after{content:"";order:1;flex:1;height:1px;background:var(--line)}
.mp .sep .act{order:2}
.mp .mt{font-size:15px;line-height:2;color:var(--text);word-break:break-word}
.mp .mins{margin-top:6px;font-size:13px;line-height:1.55;background:var(--amber-soft);color:var(--amber);border-radius:9px;padding:6px 10px}
.mp .gap{display:block;height:.9em}
.mp .mnone{font-size:13px;color:var(--muted)}
.act{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.act button{border:0;background:transparent;color:var(--accent-text);font-size:12px;font-weight:700;padding:2px 6px;border-radius:8px}
.act button:active{background:var(--accent-soft)}
.act .er{color:var(--danger)}
.mp.pg{display:flex;gap:10px;margin:0 16px}
.mp.pg .num{flex:none;width:34px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:13px;color:var(--muted);padding-top:3px}
.mp.pg .num i{flex:1;width:1px;background:var(--line);margin-top:6px}
.mp.pg .blk{flex:1;min-width:0;padding:2px 0 16px}
.mtop+.mp.pg{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-size:11.5px;font-weight:700;border-radius:10px;padding:1px 9px}
.cf{background:#fde4ec;color:#b03b63}.cp2{background:#dfeeff;color:#2f6aa8}.cl{background:#e0f2e4;color:#2f7a45}
@media(prefers-color-scheme:dark){.cf{background:#4b2f3d;color:#f6a9c6}.cp2{background:#2a3b52;color:#a9cdf5}.cl{background:#26403a;color:#9ad6bf}}
.mrow{display:flex;align-items:center;width:100%;gap:10px;border:0;background:var(--card);border-radius:12px;padding:13px 14px;margin:0 0 8px;font-size:15px;font-weight:700;text-align:left}
.mrow.dg{color:var(--danger)}
.selbar{position:fixed;left:0;right:0;top:0;z-index:45;display:flex;gap:8px;align-items:center;padding:7px 10px;background:var(--sheet);border-top:1px solid var(--line);box-shadow:0 -2px 8px #0001}
.selbar .go{flex:1;border:0;border-radius:10px;background:#3fbf9f;color:#fff;font-size:13.5px;font-weight:800;padding:10px 8px}
.selbar .go.off{background:var(--line);color:var(--muted);font-weight:700}
.selbar .g2{border:1px solid var(--line);background:var(--card);color:var(--accent-text);border-radius:10px;font-size:13px;font-weight:700;padding:10px 12px;white-space:nowrap}
.selbar .sbm{flex:1;font-size:13.5px;font-weight:700;color:var(--text)}
.go2{margin-left:auto;border:0;border-radius:9px;background:#3fbf9f;color:#fff;font-size:12px;font-weight:800;padding:5px 9px}
.tag.sp2{background:var(--amber-soft);color:var(--amber)}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top">
  <button class="ib" id="bBack" aria-label="作品一覧へ" style="display:none"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1><svg viewBox="0 0 64 64"><ellipse cx="32" cy="29" rx="21" ry="17" fill="#fff" stroke="#8272ad" stroke-width="4.5"/><path d="M21 43l-4 12 15-9z" fill="#fff" stroke="#8272ad" stroke-width="4.5" stroke-linejoin="round"/><circle cx="32" cy="29" r="4.5" fill="#f58db2"/></svg><span id="ttl">ネームノート</span><small id="sub"></small></h1>
  <button class="ib" id="bAdd" aria-label="プロットを入れ直す"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ib" id="bSet" aria-label="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
 </div>
 <div class="pgs" id="pgs"></div>
 <div class="tabs" id="tabs" style="display:none"><button data-t="dlg">セリフ</button><button data-t="memo">あらすじ・作画メモ</button></div>
</header>
<div id="banner"></div>
<div id="imp" class="imp" style="display:none">
 <h2 id="impH">プロットを貼り付け</h2>
 <p>「---1」「---2」のような区切り線の行で、ページを分けます。「」の中のセリフを、ページごとに取り出します。</p>
 <input type="text" id="wt" placeholder="作品名（あとから変えられます）" style="width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--input);padding:10px 12px;font-size:16px;margin-bottom:10px;outline:none">
 <textarea id="src" placeholder="ここにプロットを貼り付け"></textarea>
 <div class="row">
  <button class="btn" id="bGo">読み込む</button>
  <button class="btn sub" id="bFile">ファイルを選ぶ</button>
  <button class="btn sub" id="bCancel">戻る</button>
  <input type="file" id="file" accept=".txt,text/plain" hidden>
 </div>
</div>
<main id="list"></main>
</div>
<div class="bar" id="bar" style="display:none"><div class="in">
 <button class="btn sub" id="bMemo">あらすじを作る</button>
 <button class="btn" id="bAll">全ページをコピー</button>
</div></div>
<div id="selbar" class="selbar" style="display:none"></div>
<div id="toast"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var KP='name_plot_v1',KW='name_works_v2',KS='name_set_v1',CK='later_cloud_v1';
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)}
var DEF={L:9,max:4,split:true,cry:true,prev:true,head:true,view:'read'};
var set=Object.assign({},DEF,lsGet(KS,{}));
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var works=lsGet(KW,null);
if(!works){var oldp=lsGet(KP,[]);works=oldp.length?[{id:uid(),title:'無題の作品',ts:Date.now(),pages:oldp}]:[]}
works.forEach(function(w){(w.pages||[]).forEach(function(p){if(Array.isArray(p.memo)){p.memo=null;p.mh=''}p.ms='';p.err=''})});
var cur=null,pages=[],ui={tab:'dlg',imp:false};
function W(){return works.filter(function(w){return w.id===cur})[0]}
var tm;

 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(done,fb);else fb()}

/* ---------- 取り込み ---------- */
function splitPages(txt){
 var lines=txt.replace(/\r/g,'').split('\n'),out=[],buf=[],next=1;
 var re=/^\s*[-－―━─_=＝]{5,}\s*(\d+)?\s*$/;
 lines.forEach(function(l){var m=l.match(re);
  if(m){var n=m[1]?+m[1]:next;out.push({n:n,text:buf.join('\n').trim()});buf=[];next=n+1}else buf.push(l)});
 var rest=buf.join('\n').trim();if(rest)out.push({n:next,text:rest});
 return out}
var CRY=/^[ァ-ヶーッ゛゜！？!?…・、。\s　]+$/;
function parsePage(text){
 var items=[],ranges=[],i=0,n=text.length;
 while(i<n){
  var s=text.indexOf('「',i);if(s<0)break;
  var e=text.indexOf('」',s+1),s2=text.indexOf('「',s+1),body,end,unclosed=false;
  if(e>=0&&(s2<0||e<s2)){body=text.slice(s+1,e);end=e+1}
  else{var nl=text.indexOf('\n',s+1);end=nl<0?n:nl;if(s2>=0&&s2<end)end=s2;body=text.slice(s+1,end);unclosed=true}
  var mm=text.slice(end).match(/^[ \t　]*[（(]\s*※([^）)]*)[）)]/),star=false,rem='';
  if(mm){rem=mm[1].trim();star=/重要|目立|強調|大事/.test(rem);end+=mm[0].length}
  items.push({pos:s,type:'q',raw:body,star:star,rem:rem,unclosed:unclosed});ranges.push([s,end]);i=end}
 var off=0;
 text.split('\n').forEach(function(line){var st=off;off+=line.length+1;
  for(var k=0;k<ranges.length;k++)if(ranges[k][0]<=st&&st<ranges[k][1])return;
  var t=line.trim();
  if(t&&CRY.test(t)&&/[ァ-ヶ][\s\S]*[ァ-ヶ]/.test(t))items.push({pos:st,type:'c',raw:t})});
 items.sort(function(a,b){return a.pos-b.pos});
 return items}
/* 句読点を消して「句」に分ける(、。と！？のあと、空白で区切る) */
function tokenize(raw){
 var s=raw.replace(/\r/g,'').replace(/\n[\s　]*/g,''),ph=[],cur='';
 function push(end){var t=cur.replace(/[、。，．]/g,'').trim();if(t)ph.push({s:t,end:end});cur=''}
 for(var i=0;i<s.length;i++){var c=s[i];
  if(c==='、'||c==='，'){push(false);continue}
  if(c==='。'||c==='．'){push(true);continue}
  if(c==='　'||c===' '){push(/[！？!?]$/.test(cur));continue}
  cur+=c;
  if(/[！？!?]/.test(c)&&!/[！？!?]/.test(s[i+1]||''))push(true)}
 push(true);return ph}
function depthAt(p,j){var d=0;for(var i=0;i<j;i++){var c=p[i];if(c==='『'||c==='「'||c==='（'||c==='(')d++;else if(c==='』'||c==='」'||c==='）'||c===')')d--}return d}
var BADBI=/^(でし|です|であ|でき|にな|によ|とい|とし|とも)$/;
function cutCost(p,j){var a=p[j-1],b=p[j];
 if(/[ゃゅょぁぃぅぇぉっー゛゜ャュョ]/.test(b))return 99;
 if(depthAt(p,j)>0)return 99;
 if(/[…！？]/.test(a)&&!/[…！？]/.test(b))return 0;
 if(/[ぁ-ん]/.test(a)&&/[一-龥ァ-ヶ]/.test(b))return 1;
 if(/[はがをにでとも]/.test(a)&&/[ぁ-ん]/.test(b)&&!BADBI.test(a+b))return 2.5;
 return 99}
/* ---- 文節に分けて、縦長の円に収まるよう中央が少し長い行に配分する ---- */
var SEG=(typeof Intl!=='undefined'&&Intl.Segmenter)?new Intl.Segmenter('ja',{granularity:'word'}):null;
var STARTW=/^(あの|この|その|どの|ここ|そこ|あそこ|どこ|なに|なぜ|どう|そう|こう|ああ|もう|まだ|また|でも|だが|しかし|それ|これ|あれ|だから|ただ|さらに|もし|いや|ええ|はい|うう|あっ|えっ|まあ|やはり|もちろん|どうして|ありがとう|すまない|なるほど|ねえ|そして|それから|けれど|ところで|つまり)$/;
var AUXL=/^(でしょう|でしょ|ません|ました|ながら|ように|けれど|ばかり|くらい|ぐらい|なかっ|ので|のに|から|まで|ほど|だけ|です|ます|ない|らしい|たい|たく|ている|ていた|なって|なれば|られる|れる|せる|ください|ましょう|だろう|ありません|あります|いません|います|いる|ある|あった|いた|いて|して|した|され|ずに|ても|でも|には|では|とは|へは)$/;
function bunsetsu(s){
 var toks=[];
 if(SEG){var it=SEG.segment(s);for(var x of it)toks.push(x.segment)}
 var fb=!toks.length;
 if(fb){var from=0;for(var j=2;j<=s.length-2;j++){if(cutCost(s,j)<=2.5){toks.push(s.slice(from,j));from=j}}toks.push(s.slice(from))}
 var out=[],pf=false,pend='';
 toks.forEach(function(t){
  if(/^[…！？!?・]+$/.test(t)||/^[」』）)]+$/.test(t)){if(out.length)out[out.length-1].s+=t;else pend+=t;pf=true;return}
  if(/^[「『（(]+$/.test(t)){pend+=t;return}
  var fn=!fb&&/^[ぁ-ん]+$/.test(t)&&!STARTW.test(t)&&(t.length<=2||AUXL.test(t));
  var nb=!out.length||fb||(!fn&&pf);
  out.push({s:pend+t,nb:nb});pend='';pf=fn});
 if(pend){if(out.length)out[out.length-1].s+=pend;else out.push({s:pend,nb:true})}
 return out}
function layout(bs,n){
 var N=bs.length;n=Math.min(n,N);
 var pre=[0];bs.forEach(function(b){pre.push(pre[pre.length-1]+b.s.length)});
 var total=pre[N],W=[],sw=0,k,i,j;
 for(k=0;k<n;k++){var w=n<3?1:1-0.25*Math.abs(k-(n-1)/2)/((n-1)/2);W.push(w);sw+=w}
 var K=total/sw,bc=[0],depth=0,S=[0];
 for(i=0;i<N;i++)S.push(S[i]+(bs[i].sent?1:0));
 for(i=1;i<N;i++){
  var pv=bs[i-1].s;for(j=0;j<pv.length;j++){var c=pv[j];if(c==='『'||c==='「'||c==='（'||c==='(')depth++;else if(c==='』'||c==='」'||c==='）'||c===')')depth--}
  var cost=bs[i-1].strong?0:(bs[i].nb?5:14);
  if(!bs[i].nb&&bs[i].s.length===1&&/[ぁ-ん]/.test(bs[i].s))cost+=30;
  if(depth>0)cost+=99;
  if(/^[ゃゅょぁぃぅぇぉっー゛゜ャュョ]/.test(bs[i].s))cost+=99;
  bc[i]=cost}
 var INF=1e9,dp=[],bk=[];
 for(k=0;k<=n;k++){dp.push(new Array(N+1).fill(INF));bk.push(new Array(N+1).fill(-1))}
 dp[0][0]=0;
 for(k=1;k<=n;k++)for(j=k;j<=N;j++)for(i=k-1;i<j;i++){
  if(dp[k-1][i]>=INF)continue;
  var len=pre[j]-pre[i],d=len-W[k-1]*K,c2=d*d+(len>set.L+4?(len-set.L-4)*4:0)+(len<4&&total>12?(4-len)*9:0)+(i>0?bc[i]:0)+12*Math.max(0,S[j-1]-S[i]);
  if(dp[k-1][i]+c2<dp[k][j]){dp[k][j]=dp[k-1][i]+c2;bk[k][j]=i}}
 if(dp[n][N]>=INF)return null;
 var lines=[],e=N;
 for(k=n;k>=1;k--){var st=bk[k][e];lines.unshift(bs.slice(st,e).map(function(b){return b.s}).join(''));e=st}
 return {lines:lines,cost:dp[n][N]}}
function layoutBalloon(g){
 var bs=[],total=0;
 g.forEach(function(p){var parts=bunsetsu(p.s);parts.forEach(function(b,i){bs.push({s:b.s,nb:b.nb,strong:i===parts.length-1,sent:i===parts.length-1&&!!p.end});total+=b.s.length})});
 if(!bs.length)return [''];
 // 短いセリフは、句ごとに1行ずつ(「よし/上出来だな」など)
 if(total<=set.L+3&&g.length<=set.max)return g.map(function(p){return p.s});
 var nI=Math.max(1,Math.min(set.max,Math.ceil(total/(set.L+1))));
 if(total>=9&&nI<2)nI=2;
 var best=null;
 [nI,nI+1].forEach(function(n,ix){
  if(n>set.max||n>bs.length)return;
  var r=layout(bs,n);if(!r)return;
  var sc=r.cost+ix*8;
  if(!best||sc<best.sc)best={sc:sc,lines:r.lines}});
 if(best)return best.lines;
 return bs.map(function(b){return b.s}).slice(0,set.max)}
function packBalloons(ph,cap){
 var total=0;ph.forEach(function(p){total+=p.s.length});
 if(!set.split||total<=cap)return [ph];
 var k=Math.ceil(total/cap),pos=[],acc=0;
 ph.forEach(function(p){acc+=p.s.length;pos.push(acc)});
 var cuts=[],last=-1;
 for(var b=1;b<k;b++){
  var ideal=total*b/k,best=-1,bs=1e9;
  for(var i=last+1;i<ph.length-1;i++){var sc=Math.abs(pos[i]-ideal)-(ph[i].end?12:0);if(sc<bs){bs=sc;best=i}}
  if(best<0)break;cuts.push(best);last=best}
 var out=[],from=0;
 cuts.forEach(function(c){out.push(ph.slice(from,c+1));from=c+1});
 out.push(ph.slice(from));
 return out.filter(function(x){return x.length})}
function buildBalloons(text){
 var out=[];
 parsePage(text).forEach(function(it){
  if(it.type==='c'&&!set.cry)return;
  var ph=tokenize(it.raw);if(!ph.length)return;
  var groups,res;
  for(var cap=set.L*set.max;;cap-=3){
   groups=packBalloons(ph,cap);
   res=groups.map(layoutBalloon);
   var ok=res.every(function(ls){return ls.every(function(l){return l.length<=set.L+6})&&ls.join('').length<=set.L*set.max+4});
   if(ok||!set.split||cap-3<set.L*2)break}
  groups.forEach(function(g,gi){
   out.push({t:res[gi].join('\n'),star:gi===0&&it.star,rem:gi===0?it.rem:'',cry:it.type==='c',cont:gi>0,warn:it.unclosed&&gi===0?'「」が閉じていません':'',ed:false})})});
 return out}
function mkPage(o){return {n:o.n,text:o.text,h:hash(o.text),bl:buildBalloons(o.text),memo:null,mh:'',ms:'',err:'',chg:false}}
function slim(p){return {n:p.n,text:p.text,h:p.h,bl:p.bl,memo:p.memo,mh:p.mh,chg:p.chg}}
function save(){var w=cur&&W();if(w){w.pages=pages;w.ts=Date.now()}lsSet(KW,works.map(function(w){return {id:w.id,title:w.title,ts:w.ts,pages:w.pages.map(slim)}}))}
function rebuild(){works.forEach(function(w){w.pages.forEach(function(p){if(!p.bl.some(function(b){return b.ed}))p.bl=buildBalloons(p.text)})});save()}

function importText(txt){
 var raw=splitPages(txt);
 if(!raw.length||!raw.some(function(r){return r.text})){toast('プロットが空です');return false}
 var old={};pages.forEach(function(p){old[p.n]=p});
 var had=pages.length>0,changed=[];
 var np=raw.map(function(r){var o=old[r.n],h=hash(r.text);
  if(o&&o.h===h){return o}
  var p=mkPage(r);if(had){p.chg=true;changed.push(r.n)}return p});
 pages=np;if(cur)W().pages=np;save();
 toast(pages.length+'ページを読み込みました'+(had?(changed.length?'（変更'+changed.length+'ページ）':'（変更なし）'):''));
 return true}

/* あらすじ(文章) ※本文中の {服|…} {物|…} {場|…} が印 */
var MK={'服':['uf','cf','服装'],'物':['up','cp2','小物'],'場':['ul','cl','場所']};
function brk(t){var ss=[],cur='',d=0,q=0;
 for(var i=0;i<t.length;i++){var c=t[i];cur+=c;
  if(c==='{')d=1;else if(c==='}')d=0;else if(c==='「')q++;else if(c==='」')q=Math.max(0,q-1);
  if(!d&&!q&&(c==='。'||c==='！'||c==='？')){ss.push(cur);cur=''}}
 if(cur.trim())ss.push(cur);
 var gs=[],g=[],len=0,SC=/^(そこへ|その後|翌日|翌朝|翌週|一方|やがて|数日後|数時間後|数分後|次の日|その夜|その日|場面は)/;
 ss.forEach(function(x){var L=plainOf(x).length;
  if(g.length&&(len+L>150||SC.test(x))){gs.push(g);g=[];len=0}
  g.push(x);len+=L});
 if(g.length)gs.push(g);
 return gs.map(function(g){return g.join('\n')}).join('\n\n')}
function markHTML(t){return esc(brk(t)).replace(/\{(服|物|場)\|([^{}|]+)\}/g,function(x,k,w){return '<span class="u '+MK[k][0]+'">'+w+'</span>'}).replace(/\n\n/g,'<span class="gap"></span>').replace(/\n/g,'<br>')}
function plainOf(t){return String(t).replace(/\{(?:服|物|場)\|([^{}|]+)\}/g,'$1')}
function chipsOf(t){var seen={},o=[];String(t).replace(/\{(服|物|場)\|([^{}|]+)\}/g,function(x,k,w){var key=k+w;if(seen[key])return;seen[key]=1;o.push('<span class="chip '+MK[k][1]+'">'+MK[k][2]+' '+esc(w)+'</span>')});return o.length?'<div class="chips">'+o.join('')+'</div>':''}

function refreshMemo(p){var m=$('#mp'+p.n);if(m)m.outerHTML=memoPage(p)}
function pageCopyText(p){return p.bl.map(function(b){return b.t.trim()}).filter(Boolean).join('\n\n')}
function memoCopyText(p){return plainOf(brk(p.memo.t))+(p.memo.ins||[]).map(function(x){return '\n※'+x}).join('')}

/* ---------- あらすじ(AI) ---------- */
var q={run:false,stop:false,done:0,total:0};
function genMemo(p){
 p.ms='busy';p.err='';refreshMemo(p);
 var once=function(){return api('/namesum',{n:p.n,text:p.text})};
 return once().catch(function(){return new Promise(function(r){setTimeout(r,1500)}).then(once)}).then(function(r){if(!r||!r.t)throw new Error('空の返答');p.memo={t:r.t,ins:r.ins||[]};p.mh=p.h;p.ms='ok'}).catch(function(e){p.ms='err';p.err=e.message}).then(function(){save();refreshMemo(p)})}
function updBar(){
 var b=$('#bMemo');
 if(q.run){b.textContent='作成中 '+q.done+'/'+q.total+'（止める）'}else b.textContent='あらすじを作る'}
function memoAll(){
 if(q.run){q.stop=true;return}
 if(!cfg()){openSettings();toast('先にクラウドの設定をしてください');return}
 var todo=pages.filter(function(p){return p.text.trim()&&!memoOk(p)});
 if(!todo.length){toast('すべて作成済みです');return}
 q={run:true,stop:false,done:0,total:todo.length};updBar();
 var idx=0;
 function w(){if(idx>=todo.length||q.stop)return Promise.resolve();var p=todo[idx++];return genMemo(p).then(function(){q.done++;updBar();return w()})}
 Promise.all([w(),w(),w()]).then(function(){var st=q.stop;q.run=false;updBar();toast(st?'中断しました':'あらすじができました')})}

/* ---------- 作品 ---------- */
function openWork(id){cur=id;pages=W().pages;ui.tab='dlg';ui.imp=false;render();window.scrollTo(0,0)}
function goHome(){if(cur)save();cur=null;pages=[];ui.imp=false;render();window.scrollTo(0,0)}
function openImport(mode){
 ui.imp=mode;$('#impH').textContent=mode==='new'?'新しい作品を追加':'プロットを入れ直す';
 $('#wt').style.display=mode==='new'?'':'none';$('#wt').value='';$('#src').value='';
 $('#src').placeholder=mode==='new'?'ここにプロットを貼り付け':'新しいプロットを貼り付けると、前回から変わったページだけ印が付きます';
 render();window.scrollTo(0,0)}
function openWorkMenu(id){
 var w=works.filter(function(x){return x.id===id})[0];if(!w)return;
 var sh=$('#sheet');
 sh.innerHTML='<h3>'+esc(w.title)+'</h3>'+
  '<button class="mrow" data-wa="rename">✏️ 名前を変える</button>'+
  '<button class="mrow" data-wa="redo">📥 プロットを入れ直す（変わったページに印）</button>'+
  '<button class="mrow" data-wa="regen">↻ あらすじをすべて作り直す</button>'+
  '<button class="mrow dg" data-wa="del">🗑 この作品を消す</button>'+
  '<div class="row" style="margin-top:4px"><button class="btn sub" data-wa="close">閉じる</button></div>';
 sh.dataset.w=id;$('#ov').classList.add('on')}
function wAction(a,id){
 var w=works.filter(function(x){return x.id===id})[0];if(!w)return;
 if(a==='close'){closeSettings();return}
 if(a==='rename'){
  var sh=$('#sheet');sh.innerHTML='<h3>名前を変える</h3><input type="text" id="rn" value="'+esc(w.title)+'"><div class="row" style="margin-top:4px"><button class="btn" data-wa="rnok">保存</button><button class="btn sub" data-wa="close">やめる</button></div>';
  setTimeout(function(){var i=$('#rn');if(i){i.focus();i.select()}},50);return}
 if(a==='rnok'){var v=$('#rn').value.trim();if(v){w.title=v;save()}closeSettings();render();return}
 if(a==='redo'){closeSettings();if(cur!==id){cur=id;pages=w.pages}openImport('redo');return}
 if(a==='regen'){
  if(!cfg()){closeSettings();openSettings();toast('先にクラウドの設定をしてください');return}
  w.pages.forEach(function(p){p.memo=null;p.mh=''});save();closeSettings();
  if(cur!==id){cur=id;pages=w.pages}ui.tab='memo';ui.imp=false;render();window.scrollTo(0,0);setTimeout(memoAll,200);return}
 if(a==='del'){
  var sh2=$('#sheet');sh2.innerHTML='<h3>「'+esc(w.title)+'」を消しますか？</h3><p style="font-size:13.5px;color:var(--muted);line-height:1.6;margin:0 0 12px">セリフの編集とあらすじも一緒に消えます。元に戻せません。</p><div class="row"><button class="btn" style="background:var(--danger)" data-wa="delok">消す</button><button class="btn sub" data-wa="close">やめる</button></div>';return}
 if(a==='delok'){works=works.filter(function(x){return x.id!==id});if(cur===id){cur=null;pages=[]}save();closeSettings();render();toast('消しました')}}


/* ---------- 選んだ文字を別の吹き出しに / 上につなぐ ---------- */
var SB=$('#selbar'),undoSnap=null,undoTm=0;
function activeTA(){var a=document.activeElement;return a&&a.tagName==='TEXTAREA'&&a.closest('.bx')?a:null}
function sbPos(){var vv=window.visualViewport,h=SB.offsetHeight;SB.style.top=((vv?vv.offsetTop+vv.height:window.innerHeight)-h)+'px'}
function sbRender(){
 document.querySelectorAll('[data-a=split]').forEach(function(x){x.style.display='none'});
 if(undoSnap){SB.innerHTML='<span class="sbm">'+undoSnap.label+'</span><button class="g2" data-sb="undo">↩ 元に戻す</button>';SB.style.display='flex';sbPos();return}
 var ta=activeTA();if(!ta){SB.style.display='none';return}
 var row=ta.closest('.bl'),i=+row.dataset.i,has=ta.selectionEnd>ta.selectionStart;
 var ib=row.querySelector('[data-a=split]');if(ib&&has)ib.style.display='';
 SB.innerHTML='<button class="go'+(has?'':' off')+'" data-sb="split">✂ '+(has?'別の吹き出しに':'文字を選ぶと分けられます')+'</button>'+(i>0?'<button class="g2" data-sb="merge">↑ 上につなぐ</button>':'');
 SB.style.display='flex';sbPos()}
function snapPage(p,label){clearTimeout(undoTm);undoSnap={n:p.n,bl:JSON.parse(JSON.stringify(p.bl)),label:label};undoTm=setTimeout(function(){undoSnap=null;sbRender()},7000)}
function redrawPage(p){var c=$('#p'+p.n);if(c)c.outerHTML=cardHTML(p);autoGrow()}
function doSplit(ta){
 var p=pageOf(ta),row=ta.closest('.bl');if(!p||!row)return;var i=+row.dataset.i,b=p.bl[i];
 var v=ta.value,s0=ta.selectionStart,e0=ta.selectionEnd;if(e0<=s0){toast('分けたい文字を選んでください');return}
 var pre=v.slice(0,s0).replace(/\s+$/,''),mid=v.slice(s0,e0).replace(/^\s+|\s+$/g,''),post=v.slice(e0).replace(/^\s+|\s+$/g,'');
 var parts=[pre,mid,post].filter(Boolean);
 if(!mid||parts.length<2){toast('一部だけを選んでください');return}
 snapPage(p,'分けました');
 var nb=parts.map(function(t,k){return k===0?Object.assign(b,{t:t,ed:true}):{t:t,star:false,rem:'',cry:false,cont:false,warn:'',ed:true,split:true}});
 p.bl.splice.apply(p.bl,[i,1].concat(nb));
 ta.blur();save();redrawPage(p);sbRender()}
function doMerge(ta){
 var p=pageOf(ta),row=ta.closest('.bl');if(!p||!row)return;var i=+row.dataset.i;if(i<1)return;
 p.bl[i].t=ta.value;snapPage(p,'つなぎました');
 var prev=p.bl[i-1];prev.t=prev.t.replace(/\s+$/,'')+'\n'+p.bl[i].t.replace(/^\s+/,'');prev.ed=true;p.bl.splice(i,1);
 ta.blur();save();redrawPage(p);sbRender()}
function doUndo(){if(!undoSnap)return;var p=pages.filter(function(x){return x.n===undoSnap.n})[0];if(p){p.bl=undoSnap.bl;save();redrawPage(p)}clearTimeout(undoTm);undoSnap=null;sbRender()}
['mousedown','touchstart'].forEach(function(ev){SB.addEventListener(ev,function(e){e.preventDefault()},{passive:false});$('#list').addEventListener(ev,function(e){if(e.target.closest('[data-a=split]'))e.preventDefault()},{passive:false})});
SB.addEventListener('click',function(e){var b=e.target.closest('[data-sb]');if(!b)return;var k=b.dataset.sb;if(k==='undo'){doUndo();return}var ta=activeTA();if(!ta)return;if(k==='split')doSplit(ta);else if(k==='merge')doMerge(ta)});
document.addEventListener('selectionchange',function(){if(!undoSnap)sbRender()});
document.addEventListener('focusin',function(){if(!undoSnap)sbRender()});
document.addEventListener('focusout',function(){setTimeout(function(){if(!undoSnap&&!activeTA())sbRender()},150)});
if(window.visualViewport){['resize','scroll'].forEach(function(ev){window.visualViewport.addEventListener(ev,function(){if(SB.style.display!=='none')sbPos()})})}

/* ---------- イベント ---------- */
$('#list').addEventListener('click',function(e){
 var t=e.target,x;
 if((x=t.closest('[data-wm]'))){openWorkMenu(x.dataset.wm);return}
 if((x=t.closest('[data-w]'))){openWork(x.dataset.w);return}
 if((x=t.closest('[data-vw]'))){set.view=x.dataset.vw;lsSet(KS,set);render();return}
 var a=t.closest('[data-a]');if(!a)return;var p=pageOf(a);if(!p)return;var k=a.dataset.a;
 if(k==='copy'){copy(pageCopyText(p),'P'+p.n+'のセリフをコピーしました')}
 else if(k==='cb'){var i=+a.closest('.bl').dataset.i;copy(p.bl[i].t,'このフキダシをコピーしました')}
 else if(k==='split'){var ta2=a.closest('.bl').querySelector('textarea');doSplit(ta2)}
 else if(k==='memo'){genMemo(p)}
 else if(k==='reset'){p.bl=buildBalloons(p.text);save();var c=$('#p'+p.n);c.outerHTML=cardHTML(p);autoGrow()}});
var sv;
$('#list').addEventListener('input',function(e){
 var t=e.target;if(t.tagName!=='TEXTAREA')return;
 var p=pageOf(t),row=t.closest('.bl'),i=+row.dataset.i,b=p.bl[i];
 b.t=t.value;b.ed=true;
 t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';
 var pv=row.querySelector('.pvb');if(pv)pv.textContent=t.value;
 var ln=lineCount(t.value.trim()),el=row.querySelector('.ln');
 if(el){el.textContent=ln+'行';el.classList.toggle('over',ln>set.max)}
 var card=t.closest('.card');
 if(!card.querySelector('[data-a=reset]')){var cp=card.querySelector('.ch .cp'),btn=document.createElement('button');btn.className='mini';btn.dataset.a='reset';btn.textContent='元に戻す';card.querySelector('.ch').insertBefore(btn,cp)}
 clearTimeout(sv);sv=setTimeout(save,500)});
$('#pgs').addEventListener('click',function(e){var c=e.target.closest('.pgc');if(!c)return;var el=document.querySelector('#list [data-n="'+c.dataset.n+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})});
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(!b||b.dataset.t===ui.tab)return;ui.tab=b.dataset.t;render();window.scrollTo(0,0)});
$('#bBack').addEventListener('click',goHome);
$('#banner').addEventListener('click',function(e){if(e.target.id==='bSeen'){pages.forEach(function(p){p.chg=false});save();render()}});
$('#bAll').addEventListener('click',function(){
 if(ui.tab==='memo'){
  var m=pages.filter(function(p){return p.memo}).map(function(p){return '■P'+p.n+'\n'+memoCopyText(p)}).join('\n\n');
  if(!m){toast('まだあらすじがありません');return}
  copy(m,'あらすじをコピーしました');return}
 var t=pages.filter(function(p){return p.bl.length}).map(function(p){var b=pageCopyText(p);return (set.head?'■P'+p.n+'\n':'')+b}).join('\n\n');
 copy(t,'全ページのセリフをコピーしました')});
$('#bMemo').addEventListener('click',memoAll);
var scrollT=0;
window.addEventListener('scroll',function(){
 if(scrollT)return;scrollT=requestAnimationFrame(function(){scrollT=0;
  var cards=document.querySelectorAll('#list .pcell'),cur=null;
  for(var i=0;i<cards.length;i++){if(cards[i].getBoundingClientRect().top<180)cur=cards[i];else break}
  if(!cur)return;
  document.querySelectorAll('.pgc').forEach(function(c){var on=c.dataset.n===cur.dataset.n;if(on!==c.classList.contains('on')){c.classList.toggle('on',on);if(on){var bar=$('#pgs');bar.scrollTo({left:c.offsetLeft-bar.clientWidth/2+c.offsetWidth/2,behavior:'smooth'})}}})})},{passive:true});

/* 取り込み画面 */
$('#bGo').addEventListener('click',function(){
 var txt=$('#src').value;
 if(ui.imp==='new'){
  var w={id:uid(),title:$('#wt').value.trim()||'無題の作品',ts:Date.now(),pages:[]};
  works.unshift(w);cur=w.id;pages=w.pages;
  if(!importText(txt)){works.shift();cur=null;pages=[];return}
  ui.tab='dlg'}
 else if(!importText(txt))return;
 ui.imp=false;render();window.scrollTo(0,0);
 if(cfg())setTimeout(memoAll,300)});
$('#bFile').addEventListener('click',function(){$('#file').click()});
$('#file').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$('#src').value=String(r.result||'');if(ui.imp==='new'&&!$('#wt').value)$('#wt').value=f.name.replace(/\.[^.]+$/,'')};r.readAsText(f);e.target.value=''});
$('#bAdd').addEventListener('click',function(){if(!cur)openImport('new');else openWorkMenu(cur)});
$('#bCancel').addEventListener('click',function(){ui.imp=false;if(cur&&!pages.length)cur=null;render()});

/* 設定 */
function sw(k,on){return '<button class="sw'+(on?' on':'')+'" data-sw="'+k+'" aria-label="'+k+'"></button>'}
function openSettings(){
 var c=lsGet(CK,{}),sh=$('#sheet');
 sh.innerHTML='<h3>設定</h3>'+
 '<h4>セリフの整形</h4>'+
 '<div class="set"><div>1行の目安の文字数<small>これを超える句は途中で改行します</small></div><span class="sp"></span><div class="stp"><button data-st="L-">−</button><span id="vL">'+set.L+'</span><button data-st="L+">＋</button></div></div>'+
 '<div class="set"><div>1つのフキダシの最大行数</div><span class="sp"></span><div class="stp"><button data-st="m-">−</button><span id="vM">'+set.max+'</span><button data-st="m+">＋</button></div></div>'+
 '<div class="set"><div>長いセリフを複数のフキダシに分ける<small>切ると「続き」の印が付きます</small></div><span class="sp"></span>'+sw('split',set.split)+'</div>'+
 '<div class="set"><div>鳴き声（ギュア！など）も並べる</div><span class="sp"></span>'+sw('cry',set.cry)+'</div>'+
 '<h4>表示</h4>'+
 '<div class="set"><div>縦書きプレビュー</div><span class="sp"></span>'+sw('prev',set.prev)+'</div>'+
 '<div class="set"><div>全ページコピーにページ見出しを付ける<small>「■P1」の行が入ります</small></div><span class="sp"></span>'+sw('head',set.head)+'</div>'+
 '<h4>クラウド（あらすじ用）</h4>'+
 '<input type="text" id="cu" placeholder="https://….workers.dev" value="'+esc(c.url||'https://later-api.sin-matuo713.workers.dev')+'">'+
 '<input type="password" id="ct" placeholder="トークン" value="'+esc(c.token||'')+'">'+
 '<div class="row" style="margin-top:4px"><button class="btn" id="cSave">保存</button><button class="btn sub" id="cClose">閉じる</button></div>'+
 '<div style="margin-top:14px"><button class="lnk" id="cClear">保存したプロットをすべて消す</button></div>';
 $('#ov').classList.add('on')}
function closeSettings(){$('#ov').classList.remove('on')}
$('#bSet').addEventListener('click',openSettings);
$('#ov').addEventListener('click',function(e){if(e.target.id==='ov')closeSettings()});
$('#sheet').addEventListener('click',function(e){
 var t=e.target,wa=t.closest('[data-wa]');if(wa){wAction(wa.dataset.wa,$('#sheet').dataset.w);return}
 var sb=t.closest('[data-sw]'),st=t.closest('[data-st]');
 if(sb){var k=sb.dataset.sw;set[k]=!set[k];sb.classList.toggle('on',set[k]);lsSet(KS,set);rebuild();render();return}
 if(st){var d=st.dataset.st;
  if(d==='L-')set.L=Math.max(5,set.L-1);if(d==='L+')set.L=Math.min(16,set.L+1);
  if(d==='m-')set.max=Math.max(2,set.max-1);if(d==='m+')set.max=Math.min(6,set.max+1);
  $('#vL').textContent=set.L;$('#vM').textContent=set.max;lsSet(KS,set);rebuild();render();return}
 if(t.id==='cSave'){var u=$('#cu').value.trim(),tk=$('#ct').value.trim();if(!u||!tk){toast('URLとトークンを入れてください');return}lsSet(CK,{url:u,token:tk});toast('保存しました');render();return}
 if(t.id==='cClose'){closeSettings();return}
 if(t.id==='cClear'){if(confirm('すべての作品とあらすじを消します。よろしいですか？')){works=[];cur=null;pages=[];save();closeSettings();render();toast('消しました')}}});

render();
window.__name={works:function(){return works},open:openWork,home:goHome,ui:ui,pages:function(){return pages},set:function(){return set},importText:importText,render:render,build:buildBalloons};
})();
