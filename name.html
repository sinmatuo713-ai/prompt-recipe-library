<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f2f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ネームノート">
<title>ネームノート</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23eee9f7'/%3E%3Cellipse cx='32' cy='29' rx='19' ry='16' fill='%23fff' stroke='%238272ad' stroke-width='4'/%3E%3Cpath d='M22 42l-4 11 14-8z' fill='%23fff' stroke='%238272ad' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='29' r='4' fill='%23f58db2'/%3E%3C/svg%3E">
<style>
:root{--bg:#f3f2f5;--card:#fff;--text:#34313d;--muted:#817b8c;--line:#e6e2ec;--accent:#8272ad;--accent-soft:#eee9f7;--accent-text:#5f4f93;--pink:#f58db2;--pink-soft:#fde8f0;--pink-text:#b4456f;--danger:#c0506b;--shadow:0 1px 6px #3a2c6a14;--input:#fff;--sheet:#fbfafc;--amber:#a8741a;--amber-soft:#fbf0d9}
@media(prefers-color-scheme:dark){:root{--bg:#242229;--card:#2e2b35;--text:#e9e4ee;--muted:#a49eb0;--line:#3d3945;--accent:#a894e0;--accent-soft:#40385f;--accent-text:#d9cef7;--pink-soft:#4b2f3d;--pink-text:#f6a9c6;--danger:#e78aa0;--shadow:0 1px 8px #0006;--input:#38343f;--sheet:#2e2b35;--amber:#e7bd6a;--amber-soft:#4a3d22;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh;padding-bottom:calc(env(safe-area-inset-bottom) + 96px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:720px;margin:0 auto}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.top{display:flex;align-items:center;gap:8px}
.top h1{margin:0;font-size:21px;font-weight:800;flex:1;letter-spacing:.02em;display:flex;align-items:center;gap:8px;min-height:38px}
.top h1 svg{width:28px;height:28px}
.top h1 small{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0}
.ib{width:42px;height:42px;border-radius:13px;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;transition:scale .12s}
.ib:active{scale:.92}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pgs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.pgs::-webkit-scrollbar{display:none}
.pgc{position:relative;flex:none;min-width:42px;height:32px;padding:0 10px;border-radius:16px;border:0;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--muted)}
.pgc.on{background:var(--accent-soft);color:var(--accent-text);font-weight:800}
.pgc i{position:absolute;top:-1px;right:2px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--bg)}
.pgc i.s{background:var(--pink)}.pgc i.c{background:#e8a33a;right:12px}
.banner{margin:4px 16px 0;padding:10px 12px;border-radius:12px;background:var(--amber-soft);color:var(--amber);font-size:13px;display:flex;gap:8px;align-items:center;line-height:1.45}
.banner b{font-weight:800}.banner .sp{flex:1}
.banner button{border:0;background:var(--card);color:var(--text);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin:12px 16px 0;padding:14px 14px 12px;scroll-margin-top:118px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pn{font-size:17px;font-weight:800;color:var(--accent-text)}
.cnt{font-size:12px;color:var(--muted)}
.sp{flex:1}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;line-height:18px;background:var(--accent-soft);color:var(--accent-text)}
.tag.chg{background:var(--amber-soft);color:var(--amber)}
.tag.st{background:var(--pink-soft);color:var(--pink-text)}
.tag.cry{background:#e3f1ec;color:#3b7a63}
@media(prefers-color-scheme:dark){.tag.cry{background:#26403a;color:#9ad6bf}}
.mini{border:0;background:var(--accent-soft);color:var(--accent-text);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:700}
.mini:active{opacity:.7}
.cp{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:7px 14px;font-size:13px;font-weight:800}
.cp:active{opacity:.8}
.bl{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px}
.pv{flex:none;width:106px;display:flex;justify-content:center;padding-top:2px}
.pvb{writing-mode:vertical-rl;text-orientation:mixed;font-family:'Hiragino Mincho ProN','Hiragino Kaku Gothic ProN','Noto Sans CJK JP','Noto Sans JP',sans-serif;white-space:pre;font-size:12px;line-height:1.7;border:1.5px solid color-mix(in srgb,var(--text) 55%,transparent);border-radius:50%/42%;padding:14px 10px;background:var(--input);align-self:flex-start;min-height:60px}
.bx{flex:1;min-width:0}
.bx textarea{width:100%;display:block;border:1.5px solid var(--line);border-radius:12px;background:var(--input);padding:9px 11px;font-size:16px;line-height:1.55;resize:none;overflow:hidden;outline:none}
.bx textarea:focus{border-color:var(--accent)}
.bm{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.ln{font-size:12px;color:var(--muted)}.ln.over{color:var(--danger);font-weight:800}
.warn{font-size:11.5px;color:var(--amber)}
.bm .cb{margin-left:auto;border:0;background:transparent;color:var(--accent-text);font-size:12px;font-weight:700;padding:3px 6px;border-radius:8px}
.bm .cb:active{background:var(--accent-soft)}
.rem{margin-top:6px;font-size:12.5px;color:var(--pink-text);background:var(--pink-soft);border-radius:8px;padding:6px 9px;line-height:1.5}
.none{font-size:13px;color:var(--muted);padding:2px 0 10px}
.memo{border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mh b{font-size:13px;color:var(--muted);font-weight:800}
.mi{display:flex;gap:8px;font-size:14px;line-height:1.6;margin:0 0 5px}
.ml{flex:none;font-size:11px;font-weight:800;color:var(--accent-text);background:var(--accent-soft);border-radius:6px;padding:0 7px;height:20px;line-height:20px;margin-top:2px;white-space:nowrap}
.ml.ins{background:var(--pink-soft);color:var(--pink-text)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:12.5px;color:var(--danger);margin-bottom:6px;word-break:break-all}
.stale{font-size:12px;color:var(--amber);margin-bottom:6px}
.stx{font-size:12px;color:var(--accent-text);font-weight:700}
details.src{margin-top:8px}
details.src summary{font-size:12px;color:var(--muted);cursor:pointer;padding:4px 0}
details.src pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13px;line-height:1.7;margin:6px 0 0;color:var(--muted)}
.imp{margin:14px 16px 0;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.imp h2{margin:0 0 4px;font-size:17px}
.imp p{margin:0 0 12px;font-size:13px;color:var(--muted);line-height:1.6}
.imp textarea{width:100%;height:260px;border:1.5px solid var(--line);border-radius:12px;background:var(--input);padding:11px;font-size:16px;line-height:1.6;outline:none;resize:vertical}
.imp textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 18px;font-size:15px;font-weight:800;background:var(--accent);color:#fff}
.btn.sub{background:var(--accent-soft);color:var(--accent-text)}
.btn:active{opacity:.8}
.btn[disabled]{opacity:.5}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent);pointer-events:none}
.bar .in{max-width:720px;margin:0 auto;display:flex;gap:8px;pointer-events:auto}
.bar .btn{flex:1;box-shadow:0 2px 10px #3a2c6a33;padding:13px 10px;font-size:14px}
.bar .btn.sub{background:var(--card);color:var(--accent-text)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%) translateY(20px);background:#34313dee;color:#fff;border-radius:12px;padding:10px 16px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ov{position:fixed;inset:0;background:#0006;z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--sheet);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:88dvh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:17px}
.sheet h4{margin:18px 0 8px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.set{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.set .sp{flex:1}
.set small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.stp{display:flex;align-items:center;gap:2px;background:var(--accent-soft);border-radius:10px}
.stp button{width:34px;height:34px;border:0;background:transparent;font-size:18px;font-weight:800;color:var(--accent-text)}
.stp span{min-width:26px;text-align:center;font-weight:800;color:var(--accent-text)}
.sw{position:relative;width:46px;height:28px;border-radius:14px;border:0;background:var(--line);flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px #0003}
.sw.on{background:var(--accent)}.sw.on::after{left:21px}
.sheet input[type=text],.sheet input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--input);padding:9px 11px;font-size:16px;margin-bottom:8px;outline:none}
.sheet input:focus{border-color:var(--accent)}
.lnk{border:0;background:transparent;color:var(--danger);font-size:13px;font-weight:700;padding:8px 0}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top">
  <h1><svg viewBox="0 0 64 64"><ellipse cx="32" cy="29" rx="21" ry="17" fill="#fff" stroke="#8272ad" stroke-width="4.5"/><path d="M21 43l-4 12 15-9z" fill="#fff" stroke="#8272ad" stroke-width="4.5" stroke-linejoin="round"/><circle cx="32" cy="29" r="4.5" fill="#f58db2"/></svg>ネームノート<small id="sub"></small></h1>
  <button class="ib" id="bAdd" aria-label="プロットを入れ直す"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ib" id="bSet" aria-label="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
 </div>
 <div class="pgs" id="pgs"></div>
</header>
<div id="banner"></div>
<div id="imp" class="imp" style="display:none">
 <h2>プロットを貼り付け</h2>
 <p>「---1」「---2」のような区切り線の行で、ページを分けます。「」の中のセリフを、ページごとに取り出します。</p>
 <textarea id="src" placeholder="ここにプロットを貼り付け"></textarea>
 <div class="row">
  <button class="btn" id="bGo">読み込む</button>
  <button class="btn sub" id="bFile">ファイルを選ぶ</button>
  <button class="btn sub" id="bCancel" style="display:none">戻る</button>
  <input type="file" id="file" accept=".txt,text/plain" hidden>
 </div>
</div>
<main id="list"></main>
</div>
<div class="bar" id="bar" style="display:none"><div class="in">
 <button class="btn sub" id="bMemo">作画メモを作る</button>
 <button class="btn" id="bAll">全ページをコピー</button>
</div></div>
<div id="toast"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var KP='name_plot_v1',KS='name_set_v1',CK='later_cloud_v1';
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)}
var DEF={L:9,max:4,split:true,cry:true,prev:true,head:true};
var set=Object.assign({},DEF,lsGet(KS,{}));
var pages=lsGet(KP,[]);
var tm;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tm);tm=setTimeout(function(){t.classList.remove('on')},2200)}
function cfg(){var c=lsGet(CK,null);return c&&c.url&&c.token?c:null}
function api(path,body){var c=cfg();if(!c)return Promise.reject(new Error('未設定'));
 return fetch(c.url.replace(/\/+$/,'')+path,{method:'POST',headers:{'authorization':'Bearer '+c.token,'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error('HTTP '+r.status+' '+t.slice(0,100))});return r.json()})}
function copy(text,msg){
 var done=function(){toast(msg||'コピーしました')};
 var fb=function(){var t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;left:-999px;top:0;opacity:0';document.body.appendChild(t);t.focus();t.select();try{document.execCommand('copy');done()}catch(e){toast('コピーできませんでした')}t.remove()};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(done,fb);else fb()}

/* ---------- 取り込み ---------- */
function splitPages(txt){
 var lines=txt.replace(/\r/g,'').split('\n'),out=[],buf=[],next=1;
 var re=/^\s*[-－―━─_=＝]{5,}\s*(\d+)?\s*$/;
 lines.forEach(function(l){var m=l.match(re);
  if(m){var n=m[1]?+m[1]:next;out.push({n:n,text:buf.join('\n').trim()});buf=[];next=n+1}else buf.push(l)});
 var rest=buf.join('\n').trim();if(rest)out.push({n:next,text:rest});
 return out}
var CRY=/^[ァ-ヶーッ゛゜！？!?…・、。\s　]+$/;
function parsePage(text){
 var items=[],ranges=[],i=0,n=text.length;
 while(i<n){
  var s=text.indexOf('「',i);if(s<0)break;
  var e=text.indexOf('」',s+1),s2=text.indexOf('「',s+1),body,end,unclosed=false;
  if(e>=0&&(s2<0||e<s2)){body=text.slice(s+1,e);end=e+1}
  else{var nl=text.indexOf('\n',s+1);end=nl<0?n:nl;if(s2>=0&&s2<end)end=s2;body=text.slice(s+1,end);unclosed=true}
  var mm=text.slice(end).match(/^[ \t　]*[（(]\s*※([^）)]*)[）)]/),star=false,rem='';
  if(mm){rem=mm[1].trim();star=/重要|目立|強調|大事/.test(rem);end+=mm[0].length}
  items.push({pos:s,type:'q',raw:body,star:star,rem:rem,unclosed:unclosed});ranges.push([s,end]);i=end}
 var off=0;
 text.split('\n').forEach(function(line){var st=off;off+=line.length+1;
  for(var k=0;k<ranges.length;k++)if(ranges[k][0]<=st&&st<ranges[k][1])return;
  var t=line.trim();
  if(t&&CRY.test(t)&&/[ァ-ヶ][\s\S]*[ァ-ヶ]/.test(t))items.push({pos:st,type:'c',raw:t})});
 items.sort(function(a,b){return a.pos-b.pos});
 return items}
/* 句読点を消して「句」に分ける(、。と！？のあと、空白で区切る) */
function tokenize(raw){
 var s=raw.replace(/\r/g,'').replace(/\n[\s　]*/g,''),ph=[],cur='';
 function push(end){var t=cur.replace(/[、。，．]/g,'').trim();if(t)ph.push({s:t,end:end});cur=''}
 for(var i=0;i<s.length;i++){var c=s[i];
  if(c==='、'||c==='，'){push(false);continue}
  if(c==='。'||c==='．'){push(true);continue}
  if(c==='　'||c===' '){push(/[！？!?]$/.test(cur));continue}
  cur+=c;
  if(/[！？!?]/.test(c)&&!/[！？!?]/.test(s[i+1]||''))push(true)}
 push(true);return ph}
function depthAt(p,j){var d=0;for(var i=0;i<j;i++){var c=p[i];if(c==='『'||c==='「'||c==='（'||c==='(')d++;else if(c==='』'||c==='」'||c==='）'||c===')')d--}return d}
var BADBI=/^(でし|です|であ|でき|にな|によ|とい|とし|とも)$/;
function cutCost(p,j){var a=p[j-1],b=p[j];
 if(/[ゃゅょぁぃぅぇぉっー゛゜ャュョ]/.test(b))return 99;
 if(depthAt(p,j)>0)return 99;
 if(/[…！？]/.test(a)&&!/[…！？]/.test(b))return 0;
 if(/[ぁ-ん]/.test(a)&&/[一-龥ァ-ヶ]/.test(b))return 1;
 if(/[はがをにでとも]/.test(a)&&/[ぁ-ん]/.test(b)&&!BADBI.test(a+b))return 2.5;
 return 99}
function split2(p){var mid=p.length/2,best=-1,bs=1e9;
 for(var j=2;j<=p.length-2;j++){var c=cutCost(p,j);if(c>=99)continue;var sc=Math.abs(j-mid)+c;if(sc<bs){bs=sc;best=j}}
 if(best<0||bs>p.length/3+2)return null;
 return [p.slice(0,best),p.slice(best)]}
function wrap(strs){
 var lines=strs.slice(),skip={};
 while(lines.length<set.max){var bi=-1,bl=set.L+2;
  for(var i=0;i<lines.length;i++)if(!skip[lines[i]]&&lines[i].length>bl){bl=lines[i].length;bi=i}
  if(bi<0)break;
  var sp=split2(lines[bi]);if(!sp){skip[lines[bi]]=1;continue}
  lines.splice(bi,1,sp[0],sp[1])}
 while(lines.length>set.max){var mi=0,mv=1e9;
  for(var k=0;k<lines.length-1;k++){var v=lines[k].length+lines[k+1].length;if(v<mv){mv=v;mi=k}}
  lines.splice(mi,2,lines[mi]+lines[mi+1])}
 return lines}
function packBalloons(ph,cap){
 var total=0;ph.forEach(function(p){total+=p.s.length});
 if(!set.split||total<=cap)return [ph];
 var k=Math.ceil(total/cap),pos=[],acc=0;
 ph.forEach(function(p){acc+=p.s.length;pos.push(acc)});
 var cuts=[],last=-1;
 for(var b=1;b<k;b++){
  var ideal=total*b/k,best=-1,bs=1e9;
  for(var i=last+1;i<ph.length-1;i++){var sc=Math.abs(pos[i]-ideal)-(ph[i].end?6:0);if(sc<bs){bs=sc;best=i}}
  if(best<0)break;cuts.push(best);last=best}
 var out=[],from=0;
 cuts.forEach(function(c){out.push(ph.slice(from,c+1));from=c+1});
 out.push(ph.slice(from));
 return out.filter(function(x){return x.length})}
function buildBalloons(text){
 var out=[];
 parsePage(text).forEach(function(it){
  if(it.type==='c'&&!set.cry)return;
  var ph=tokenize(it.raw);if(!ph.length)return;
  var groups,res;
  for(var cap=set.L*set.max;;cap-=3){
   groups=packBalloons(ph,cap);
   res=groups.map(function(g){return wrap(g.map(function(p){return p.s}))});
   var ok=res.every(function(ls){return ls.every(function(l){return l.length<=set.L+6})});
   if(ok||!set.split||cap-3<set.L*2)break}
  groups.forEach(function(g,gi){
   out.push({t:res[gi].join('\n'),star:gi===0&&it.star,rem:gi===0?it.rem:'',cry:it.type==='c',cont:gi>0,warn:it.unclosed&&gi===0?'「」が閉じていません':'',ed:false})})});
 return out}
function mkPage(o){return {n:o.n,text:o.text,h:hash(o.text),bl:buildBalloons(o.text),memo:null,mh:'',ms:'',err:'',chg:false}}
function save(){lsSet(KP,pages.map(function(p){return {n:p.n,text:p.text,h:p.h,bl:p.bl,memo:p.memo,mh:p.mh,chg:p.chg}}))}
function rebuild(){pages.forEach(function(p){if(!p.bl.some(function(b){return b.ed}))p.bl=buildBalloons(p.text)});save()}

function importText(txt){
 var raw=splitPages(txt);
 if(!raw.length||!raw.some(function(r){return r.text})){toast('プロットが空です');return false}
 var old={};pages.forEach(function(p){old[p.n]=p});
 var had=pages.length>0,changed=[];
 var np=raw.map(function(r){var o=old[r.n],h=hash(r.text);
  if(o&&o.h===h){return o}
  var p=mkPage(r);if(had){p.chg=true;changed.push(r.n)}return p});
 pages=np;save();
 toast(pages.length+'ページを読み込みました'+(had?(changed.length?'（変更'+changed.length+'ページ）':'（変更なし）'):''));
 return true}

/* ---------- 描画 ---------- */
function lineCount(t){return t?t.split('\n').length:0}
function balloonHTML(p,b,i){
 var ln=lineCount(b.t),over=ln>set.max,long=b.t.split('\n').some(function(l){return l.length>set.L+6});
 return '<div class="bl" data-i="'+i+'">'+
  (set.prev?'<div class="pv"><div class="pvb">'+esc(b.t)+'</div></div>':'')+
  '<div class="bx"><textarea rows="'+Math.max(1,ln)+'" spellcheck="false" autocomplete="off">'+esc(b.t)+'</textarea>'+
  '<div class="bm">'+(b.star?'<span class="tag st">★ 重要</span>':'')+(b.cry?'<span class="tag cry">鳴き声</span>':'')+(b.cont?'<span class="tag">続き</span>':'')+
  '<span class="ln'+(over?' over':'')+'">'+ln+'行'+(long&&!over?'・1行長め':'')+'</span>'+
  (b.warn?'<span class="warn">'+esc(b.warn)+'</span>':'')+
  '<button class="cb" data-a="cb">コピー</button></div>'+
  (b.rem?'<div class="rem">※ '+esc(b.rem)+'</div>':'')+'</div></div>'}
function memoHTML(p){
 var blank=!p.text.trim(),h='<div class="mh"><b>作画メモ</b><span class="sp"></span>';
 if(p.ms==='busy')h+='<span class="stx">作成中…</span>';
 else if(!blank){h+='<button class="mini" data-a="memo">'+(p.memo?'↻ 作り直す':'作る')+'</button>';if(p.memo&&p.memo.length)h+='<button class="mini" data-a="cpm">コピー</button>'}
 h+='</div>';
 if(p.ms==='err')h+='<div class="err">作れませんでした（'+esc(p.err)+'）</div>';
 if(p.memo){
  if(p.mh!==p.h)h+='<div class="stale">原文が変わりました。作り直してください</div>';
  if(!p.memo.length)h+='<div class="hint">拾える情報がありませんでした</div>';
  p.memo.forEach(function(s){var m=String(s).match(/^([^：:]{1,8})[：:]\s*([\s\S]*)$/);
   if(m)h+='<div class="mi"><span class="ml'+(m[1]==='指示'?' ins':'')+'">'+esc(m[1])+'</span><span>'+esc(m[2])+'</span></div>';
   else h+='<div class="mi"><span>'+esc(s)+'</span></div>'})}
 else if(p.ms!=='busy'&&p.ms!=='err'){h+='<div class="hint">'+(cfg()?'まだ作っていません':'設定でクラウドをつなぐと作れます')+'</div>'}
 return h}
function cardHTML(p){
 var bl=p.bl;
 return '<section class="card" id="p'+p.n+'" data-n="'+p.n+'"><div class="ch"><span class="pn">P'+p.n+'</span>'+
  (p.chg?'<span class="tag chg">変更</span>':'')+
  '<span class="cnt">'+(bl.length?'セリフ '+bl.length:'')+'</span><span class="sp"></span>'+
  (bl.some(function(b){return b.ed})?'<button class="mini" data-a="reset">元に戻す</button>':'')+
  (bl.length?'<button class="cp" data-a="copy">コピー</button>':'')+'</div>'+
  (bl.length?'<div class="bls">'+bl.map(function(b,i){return balloonHTML(p,b,i)}).join('')+'</div>':'<div class="none">セリフなし</div>')+
  '<div class="memo" id="m'+p.n+'">'+memoHTML(p)+'</div>'+
  '<details class="src"><summary>原文を見る</summary><pre>'+esc(p.text||'（空のページ）')+'</pre></details></section>'}
function render(){
 var has=pages.length>0,imp=$('#imp');
 $('#list').innerHTML=has?pages.map(cardHTML).join(''):'';
 $('#bar').style.display=has?'':'none';
 $('#pgs').style.display=has?'':'none';
 imp.style.display=has?'none':'';
 $('#sub').textContent=has?pages.length+'ページ':'';
 if(has)renderChips();renderBanner();
 autoGrow()}
function renderChips(){
 $('#pgs').innerHTML=pages.map(function(p){
  var star=p.bl.some(function(b){return b.star});
  return '<button class="pgc" data-n="'+p.n+'">P'+p.n+(star?'<i class="s"></i>':'')+(p.chg?'<i class="c"></i>':'')+'</button>'}).join('')}
function renderBanner(){
 var ch=pages.filter(function(p){return p.chg});
 $('#banner').innerHTML=ch.length?'<div class="banner"><span><b>'+ch.length+'ページ</b>が前回から変わりました（'+ch.map(function(p){return 'P'+p.n}).join(' ')+'）</span><span class="sp"></span><button id="bSeen">確認した</button></div>':''}
function autoGrow(){document.querySelectorAll('.bx textarea').forEach(function(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px'})}
function pageOf(el){var c=el.closest('.card');if(!c)return null;var n=+c.dataset.n;return pages.filter(function(p){return p.n===n})[0]}
function refreshMemo(p){var m=$('#m'+p.n);if(m)m.innerHTML=memoHTML(p)}
function pageCopyText(p){return p.bl.map(function(b){return b.t.trim()}).filter(Boolean).join('\n\n')}

/* ---------- 作画メモ(AI) ---------- */
var q={run:false,stop:false,done:0,total:0};
function genMemo(p){
 p.ms='busy';p.err='';refreshMemo(p);
 return api('/namememo',{n:p.n,text:p.text}).then(function(r){p.memo=r.notes||[];p.mh=p.h;p.ms='ok'}).catch(function(e){p.ms='err';p.err=e.message}).then(function(){save();refreshMemo(p)})}
function updBar(){
 var b=$('#bMemo');
 if(q.run){b.textContent='作成中 '+q.done+'/'+q.total+'（止める）'}else b.textContent='作画メモを作る'}
function memoAll(){
 if(q.run){q.stop=true;return}
 if(!cfg()){openSettings();toast('先にクラウドの設定をしてください');return}
 var todo=pages.filter(function(p){return p.text.trim()&&(!p.memo||p.mh!==p.h)});
 if(!todo.length){toast('すべて作成済みです');return}
 q={run:true,stop:false,done:0,total:todo.length};updBar();
 var idx=0;
 function w(){if(idx>=todo.length||q.stop)return Promise.resolve();var p=todo[idx++];return genMemo(p).then(function(){q.done++;updBar();return w()})}
 Promise.all([w(),w(),w()]).then(function(){var st=q.stop;q.run=false;updBar();toast(st?'中断しました':'作画メモができました')})}

/* ---------- イベント ---------- */
$('#list').addEventListener('click',function(e){
 var a=e.target.closest('[data-a]');if(!a)return;var p=pageOf(a);if(!p)return;var k=a.dataset.a;
 if(k==='copy'){copy(pageCopyText(p),'P'+p.n+'のセリフをコピーしました')}
 else if(k==='cb'){var i=+a.closest('.bl').dataset.i;copy(p.bl[i].t,'このフキダシをコピーしました')}
 else if(k==='memo'){genMemo(p)}
 else if(k==='cpm'){copy((p.memo||[]).join('\n'),'作画メモをコピーしました')}
 else if(k==='reset'){p.bl=buildBalloons(p.text);save();var c=$('#p'+p.n);c.outerHTML=cardHTML(p);autoGrow()}});
var sv;
$('#list').addEventListener('input',function(e){
 var t=e.target;if(t.tagName!=='TEXTAREA')return;
 var p=pageOf(t),row=t.closest('.bl'),i=+row.dataset.i,b=p.bl[i];
 b.t=t.value;b.ed=true;
 t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';
 var pv=row.querySelector('.pvb');if(pv)pv.textContent=t.value;
 var ln=lineCount(t.value.trim()),el=row.querySelector('.ln');
 if(el){el.textContent=ln+'行';el.classList.toggle('over',ln>set.max)}
 var card=t.closest('.card');
 if(!card.querySelector('[data-a=reset]')){var cp=card.querySelector('.ch .cp'),btn=document.createElement('button');btn.className='mini';btn.dataset.a='reset';btn.textContent='元に戻す';card.querySelector('.ch').insertBefore(btn,cp)}
 clearTimeout(sv);sv=setTimeout(save,500)});
$('#pgs').addEventListener('click',function(e){var c=e.target.closest('.pgc');if(!c)return;var el=$('#p'+c.dataset.n);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})});
$('#banner').addEventListener('click',function(e){if(e.target.id==='bSeen'){pages.forEach(function(p){p.chg=false});save();render()}});
$('#bAll').addEventListener('click',function(){
 var t=pages.filter(function(p){return p.bl.length}).map(function(p){var b=pageCopyText(p);return (set.head?'■P'+p.n+'\n':'')+b}).join('\n\n');
 copy(t,'全ページのセリフをコピーしました')});
$('#bMemo').addEventListener('click',memoAll);
var scrollT=0;
window.addEventListener('scroll',function(){
 if(scrollT)return;scrollT=requestAnimationFrame(function(){scrollT=0;
  var cards=document.querySelectorAll('.card'),cur=null;
  for(var i=0;i<cards.length;i++){if(cards[i].getBoundingClientRect().top<150)cur=cards[i];else break}
  if(!cur)return;
  document.querySelectorAll('.pgc').forEach(function(c){var on=c.dataset.n===cur.dataset.n;if(on!==c.classList.contains('on')){c.classList.toggle('on',on);if(on){var bar=$('#pgs');bar.scrollTo({left:c.offsetLeft-bar.clientWidth/2+c.offsetWidth/2,behavior:'smooth'})}}})})},{passive:true});

/* 取り込み画面 */
$('#bGo').addEventListener('click',function(){
 if(!importText($('#src').value))return;
 $('#src').value='';render();window.scrollTo(0,0);
 if(cfg())setTimeout(memoAll,300)});
$('#bFile').addEventListener('click',function(){$('#file').click()});
$('#file').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$('#src').value=String(r.result||'')};r.readAsText(f);e.target.value=''});
$('#bAdd').addEventListener('click',function(){
 var imp=$('#imp');imp.style.display='';$('#bCancel').style.display=pages.length?'':'none';
 $('#src').placeholder=pages.length?'新しいプロットを貼り付けると、前回から変わったページだけ印が付きます':'ここにプロットを貼り付け';
 window.scrollTo(0,0);setTimeout(function(){$('#src').focus()},50)});
$('#bCancel').addEventListener('click',function(){$('#imp').style.display='none'});

/* 設定 */
function sw(k,on){return '<button class="sw'+(on?' on':'')+'" data-sw="'+k+'" aria-label="'+k+'"></button>'}
function openSettings(){
 var c=lsGet(CK,{}),sh=$('#sheet');
 sh.innerHTML='<h3>設定</h3>'+
 '<h4>セリフの整形</h4>'+
 '<div class="set"><div>1行の目安の文字数<small>これを超える句は途中で改行します</small></div><span class="sp"></span><div class="stp"><button data-st="L-">−</button><span id="vL">'+set.L+'</span><button data-st="L+">＋</button></div></div>'+
 '<div class="set"><div>1つのフキダシの最大行数</div><span class="sp"></span><div class="stp"><button data-st="m-">−</button><span id="vM">'+set.max+'</span><button data-st="m+">＋</button></div></div>'+
 '<div class="set"><div>長いセリフを複数のフキダシに分ける<small>切ると「続き」の印が付きます</small></div><span class="sp"></span>'+sw('split',set.split)+'</div>'+
 '<div class="set"><div>鳴き声（ギュア！など）も並べる</div><span class="sp"></span>'+sw('cry',set.cry)+'</div>'+
 '<h4>表示</h4>'+
 '<div class="set"><div>縦書きプレビュー</div><span class="sp"></span>'+sw('prev',set.prev)+'</div>'+
 '<div class="set"><div>全ページコピーにページ見出しを付ける<small>「■P1」の行が入ります</small></div><span class="sp"></span>'+sw('head',set.head)+'</div>'+
 '<h4>クラウド（作画メモ用）</h4>'+
 '<input type="text" id="cu" placeholder="https://….workers.dev" value="'+esc(c.url||'https://later-api.sin-matuo713.workers.dev')+'">'+
 '<input type="password" id="ct" placeholder="トークン" value="'+esc(c.token||'')+'">'+
 '<div class="row" style="margin-top:4px"><button class="btn" id="cSave">保存</button><button class="btn sub" id="cClose">閉じる</button></div>'+
 '<div style="margin-top:14px"><button class="lnk" id="cClear">保存したプロットを消す</button></div>';
 $('#ov').classList.add('on')}
function closeSettings(){$('#ov').classList.remove('on')}
$('#bSet').addEventListener('click',openSettings);
$('#ov').addEventListener('click',function(e){if(e.target.id==='ov')closeSettings()});
$('#sheet').addEventListener('click',function(e){
 var t=e.target,sb=t.closest('[data-sw]'),st=t.closest('[data-st]');
 if(sb){var k=sb.dataset.sw;set[k]=!set[k];sb.classList.toggle('on',set[k]);lsSet(KS,set);rebuild();render();return}
 if(st){var d=st.dataset.st;
  if(d==='L-')set.L=Math.max(5,set.L-1);if(d==='L+')set.L=Math.min(16,set.L+1);
  if(d==='m-')set.max=Math.max(2,set.max-1);if(d==='m+')set.max=Math.min(6,set.max+1);
  $('#vL').textContent=set.L;$('#vM').textContent=set.max;lsSet(KS,set);rebuild();render();return}
 if(t.id==='cSave'){var u=$('#cu').value.trim(),tk=$('#ct').value.trim();if(!u||!tk){toast('URLとトークンを入れてください');return}lsSet(CK,{url:u,token:tk});toast('保存しました');render();return}
 if(t.id==='cClose'){closeSettings();return}
 if(t.id==='cClear'){if(confirm('保存したプロットと作画メモを消します。よろしいですか？')){pages=[];save();closeSettings();render();toast('消しました')}}});

render();
window.__name={pages:function(){return pages},set:function(){return set},importText:importText,render:render,build:buildBalloons};
})();
</script>
</body>
</html>
